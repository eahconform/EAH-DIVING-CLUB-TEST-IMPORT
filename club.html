
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03131f">
<title>EAH Diving Club</title>

<style>
:root {
  --primary:#0b6bff;
  --secondary:#03131f;
  --text:#ffffff;
  --muted:#b8cadb;
  --card:#102b42;
  --radius:14px;
  --overlay:.58;
  --font:Arial,sans-serif;
}
* {box-sizing:border-box}
[hidden] {display:none!important}
body {
  margin:0;
  background:var(--secondary);
  color:var(--text);
  font-family:var(--font);
}
button,input,select,textarea {font:inherit}
button {cursor:pointer}
button:disabled {opacity:.5;cursor:not-allowed}
a {color:inherit}
header {
  position:sticky;
  top:0;
  z-index:20;
  padding:14px 20px;
  background:var(--secondary);
  border-bottom:1px solid #ffffff30;
}
.header-inner {
  max-width:1300px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.brand {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:20px;
  font-weight:800;
}
.brand img {
  width:52px;
  height:52px;
  object-fit:contain;
}
nav,.actions {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
button,.primary-button {
  padding:11px 15px;
  border:1px solid #ffffff50;
  border-radius:10px;
  background:transparent;
  color:inherit;
  text-decoration:none;
}
button.active,.primary-button {
  background:var(--primary);
  border-color:var(--primary);
  color:#fff;
}
.hero {
  position:relative;
  min-height:320px;
  padding:45px 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background-position:center;
  background-size:cover;
}
.hero:before {
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,12,24,var(--overlay));
}
.hero-content {
  position:relative;
  max-width:1000px;
}
.hero h1 {
  margin:0;
  color:#fff;
  font-size:clamp(30px,5vw,56px);
  overflow-wrap:anywhere;
  text-shadow:0 3px 15px #000;
}
.hero p {
  font-size:20px;
  color:#fff;
  text-shadow:0 2px 10px #000;
}
main {
  max-width:1250px;
  min-height:250px;
  margin:auto;
  padding:35px 20px 80px;
}
.page {display:none}
.page.active {display:block}
.page h2 {font-size:clamp(26px,4vw,40px)}
.description {
  white-space:pre-wrap;
  line-height:1.7;
}
.muted {color:var(--muted)}
.cards {
  display:grid;
  grid-template-columns:repeat(
    auto-fill,
    minmax(min(100%,220px),280px)
  );
  gap:18px;
  margin-top:22px;
}
.card,.panel {
  background:var(--card);
  border:1px solid #ffffff30;
  border-radius:var(--radius);
  padding:17px;
  min-width:0;
}
.card {
  display:flex;
  flex-direction:column;
  gap:10px;
}
.card img {
  width:100%;
  aspect-ratio:1/1;
  object-fit:contain;
}
.card h3 {margin:4px 0}
.price {
  font-size:22px;
  font-weight:bold;
}
.page-image {
  width:100%;
  max-height:560px;
  object-fit:contain;
  border-radius:12px;
  margin:20px 0;
}
.page-video {
  display:block;
  width:100%;
  max-width:850px;
  margin:15px auto;
}
.form {
  display:grid;
  gap:14px;
  max-width:550px;
}
label {display:grid;gap:6px}
input,select,textarea {
  width:100%;
  padding:12px;
  border-radius:9px;
  border:1px solid #ffffff50;
  background:#112b40;
  color:#fff;
}
.status {
  padding:14px;
  margin:15px 0;
  border-radius:10px;
  background:#ffffff15;
  white-space:pre-wrap;
}
.error {
  border:1px solid #ff7777;
  color:#ffd5d5;
}
.success {border:1px solid #50d69b}
.empty {
  padding:20px;
  border:1px solid #ffffff30;
  border-radius:10px;
  color:var(--muted);
}
.cart-line {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #ffffff30;
  padding:10px 0;
}
footer {
  text-align:center;
  padding:28px;
  border-top:1px solid #ffffff20;
  color:var(--muted);
}
#loading {
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  text-align:center;
}
.modal {
  position:fixed;
  inset:0;
  z-index:1000;
  display:grid;
  place-items:center;
  padding:15px;
  background:#000d;
}
.modal-window {
  width:min(100%,920px);
  max-height:92vh;
  overflow:auto;
  padding:22px;
  border-radius:16px;
  border:1px solid #ffffff45;
  background:var(--card);
}
.modal-close {float:right}
.modal-media {
  display:block;
  width:100%;
  max-height:60vh;
  object-fit:contain;
  margin:14px 0;
}
.gallery {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.gallery button {
  width:80px;
  height:70px;
  padding:3px;
}
.gallery img {
  width:100%;
  height:100%;
  object-fit:contain;
}
.detail-line {
  border-bottom:1px solid #ffffff25;
  padding:10px 0;
}
@media(max-width:650px) {
  header {padding:10px}
  .header-inner,nav {justify-content:center}
  nav button {font-size:13px;padding:9px}
  .hero {min-height:260px}
  .cards {
    grid-template-columns:
      repeat(auto-fit,minmax(150px,1fr));

</style>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
(function() {
"use strict";

/* ==========================================
   EAH DIVING CLUB - VERSION CORRIGEE
========================================== */

const SUPABASE_URL =
  "https://limyeqpdzjjwsdximehp.supabase.co";

const PUBLIC_KEY =
  "sb_publishable_K9iUm_0Qhea65P1Zt6rbXQ_BXQCzJ9w";

const DEFAULT_CLUB =
  "eah-club-demo-1793054157740";

const params = new URLSearchParams(location.search);

const CLUB_SLUG =
  params.get("club") ||
  params.get("eah_club_preview") ||
  DEFAULT_CLUB;

const NFC_TOKEN = params.get("nfc");

const $ = id => document.getElementById(id);

const state = {
  club:null,
  config:{},
  pages:[],
  badges:[],
  products:[],
  cart:[],
  user:null,
  member:null,
  currentPage:"",
  sb:null
};

const MANAGER_ROLES = [
  "admin","owner","manager","responsable"
];

/* ==========================================
   OUTILS GENERAUX
========================================== */

function el(tag, cls="", value) {
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(value !== undefined)
    e.textContent = String(value ?? "");
  return e;
}

function button(label, handler, primary=false) {
  const b = el(
    "button",
    primary ? "primary-button" : "",
    label
  );
  b.type = "button";
  b.addEventListener("click",handler);
  return b;
}

function message(parent,text,error=false) {
  parent.replaceChildren(
    el(
      "div",
      "status " + (error ? "error":"success"),
      text
    )
  );
}

function money(value) {
  return Number(value || 0).toLocaleString(
    "fr-FR",
    {style:"currency",currency:"EUR"}
  );
}

function array(value) {
  return Array.isArray(value) ? value : [];
}

function object(value) {
  return value &&
    typeof value === "object" &&
    !Array.isArray(value)
      ? value : {};
}

function description(parent,text) {
  if(!text) return;
  parent.appendChild(
    el("p","description",text)
  );
}

function safeImage(value) {
  if(!value) return "";

  const raw = String(value).trim();

  let match = raw.match(
    /drive\.google\.com\/file\/d\/([\w-]+)/
  );

  if(!match) {
    match = raw.match(
      /[?&]id=([\w-]{20,})/
    );
  }

  if(!match && /^[\w-]{20,}$/.test(raw)) {
    match = [raw,raw];
  }

  if(match) {
    return (
      "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(match[1]) +
      "&sz=w1000"
    );
  }

  try {
    const url = new URL(raw,location.href);

    if(["https:","http:"].includes(url.protocol))
      return url.href;
  } catch(e) {}

  return "";
}

function image(parent,url,alt,cls="") {
  const src = safeImage(url);
  if(!src) return null;

  const img = el("img",cls);
  img.src = src;
  img.alt = alt || "";
  img.loading = "lazy";
  img.onerror = () => {
    img.hidden = true;
  };

  parent.appendChild(img);
  return img;
}

function video(parent,url) {
  const src = safeImage(url);
  if(!src) return;

  if(/\.(mp4|webm|ogg)([?#]|$)/i.test(src)) {
    const v = el("video","page-video");
    v.src = src;
    v.controls = true;
    v.preload = "metadata";
    parent.appendChild(v);
  } else {
    const a = el("a","","Voir la vidéo");
    a.href = src;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    parent.appendChild(a);
  }
}

function safeColor(value,fallback) {
  const colors = {
    "bleu":"#0b6bff",
    "bleu marine":"#102040",
    "bleu clair":"#70c8ff",
    "orange":"#ff9800",
    "vert":"#23a455",
    "rouge":"#e53935",
    "blanc":"#ffffff",
    "noir":"#000000",
    "gris":"#808080",
    "jaune":"#ffd600",
    "rose":"#ff69b4",
    "violet":"#9333ea"
  };

  const text = String(value || "").trim();

  return colors[text.toLowerCase()] ||
    (/^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(text)
      ? text : fallback);
}

function numeric(value,fallback,min,max) {
  const n = Number(value);
  return value !== "" &&
    value != null &&
    Number.isFinite(n) &&
    n >= min && n <= max
      ? n : fallback;
}

/* ==========================================
   SUPABASE - LECTURE PUBLIQUE
========================================== */

async function publicQuery(table,extra="") {
  const url =
    SUPABASE_URL +
    "/rest/v1/" +
    encodeURIComponent(table) +
    "?select=*" +
    extra;

  const controller = new AbortController();

  const timeout = setTimeout(
    () => controller.abort(),
    12000
  );

  try {
    const response = await fetch(url,{
      headers:{
        apikey:PUBLIC_KEY,
        Authorization:"Bearer " + PUBLIC_KEY,
        Accept:"application/json"
      },
      signal:controller.signal,
      cache:"no-store"
    });

    if(!response.ok) {
      const body = await response.text();

      throw new Error(
        table + " : HTTP " +
        response.status + " " +
        body.slice(0,150)
      );
    }

    return await response.json();

  } finally {
    clearTimeout(timeout);
  }
}

async function loadClub() {
  const clubs = await publicQuery(
    "clubs",
    "&slug=eq." +
    encodeURIComponent(CLUB_SLUG) +
    "&limit=1"
  );

  if(!clubs.length) {
    throw new Error(
      "Club introuvable ou non accessible : " +
      CLUB_SLUG
    );
  }

  const club = clubs[0];
  const id = encodeURIComponent(club.id);

  const requests = [
    [
      "config",
      "eah_club_site_config",
      "&club_id=eq." + id
    ],
    [
      "pages",
      "eah_club_pages",
      "&club_id=eq." + id +
      "&active=eq.true&order=sort_order.asc"
    ],
    [
      "badges",
      "eah_club_badges",
      "&club_id=eq." + id +
      "&active=eq.true&order=sort_order.asc"
    ],
    [
      "products",
      "eah_club_products",
      "&club_id=eq." + id +
      "&active=eq.true&order=sort_order.asc"
    ]
  ];

  const results = await Promise.allSettled(
    requests.map(r => publicQuery(r[1],r[2]))
  );

  const data = {};

  results.forEach((result,index) => {
    const key = requests[index][0];

    if(result.status === "fulfilled") {
      data[key] = result.value;
    } else {
      console.warn(
        "EAH chargement " + key,
        result.reason
      );
      data[key] = [];
    }
  });

  state.club = club;
  state.config = data.config[0] || {};
  state.pages = data.pages;
  state.badges = data.badges;
  state.products = data.products;

  if(!state.pages.length) {
    state.pages = [{
      slug:"accueil",
      title:"Accueil",
      description:
        club.welcome_text ||
        "Bienvenue sur le site de votre club.",
      settings:{}
    }];
  }
}

/* ==========================================
   THEMES ET PERSONNALISATION
========================================== */

function applyTheme() {
  const cfg = state.config;
  const s = object(cfg.settings);
  const c = state.club || {};

  const themes = {
    1:[
      "#1478ff","#071725","#10243a",
      "#e8f2ff","#ffffff","#15324c"
    ],
    2:[
      "#c7a466","#101010","#171717",
      "#ede5d7","#f1d394","#24211c"
    ],
    3:[
      "#087e8b","#f3f6f8","#ffffff",
      "#263746","#183044","#ffffff"
    ],
    4:[
      "#a855f7","#140d1f","#21152f",
      "#f5efff","#ffffff","#302041"
    ],
    5:[
      "#7bc99c","#0d211e","#102c28",
      "#e6f5e9","#ffffff","#193b34"
    ]
  };

  const theme =
    themes[Number(s.STYLE_NUMERO)] ||
    themes[1];

  const root = document.documentElement;

  const vars = {
    "--primary":safeColor(
      s.PRIMARY_COLOR ||
      cfg.primary_color ||
      c.primary_color,
      theme[0]
    ),
    "--secondary":safeColor(
      s.BACKGROUND_COLOR ||
      cfg.secondary_color,
      theme[1]
    ),
    "--text":safeColor(
      s.TEXT_COLOR,theme[3]
    ),
    "--card":safeColor(
      s.CARD_COLOR,theme[5]
    ),
    "--radius":
      numeric(s.CARD_RADIUS,14,0,40) + "px",
    "--overlay":
      numeric(s.HERO_OVERLAY,.58,0,1)
  };

  Object.entries(vars).forEach(([key,value]) => {
    root.style.setProperty(key,value);
  });

  const fonts = {
    "Arial":"Arial,sans-serif",
    "Roboto":"Roboto,Arial,sans-serif",
    "Verdana":"Verdana,sans-serif",
    "Georgia":"Georgia,serif",
    "Tahoma":"Tahoma,sans-serif",
    "Times New Roman":"Times New Roman,serif"
  };

  root.style.setProperty(
    "--font",
    fonts[s.FONT_FAMILY || s.TEXT_FONT] ||
    theme.font ||
    "Arial,sans-serif"
  );

  document.body.style.fontSize =
    numeric(s.TEXT_SIZE,16,10,32) + "px";

  const header = document.querySelector("header");

  if(header) {
    header.style.backgroundColor =
      safeColor(s.HEADER_COLOR,theme[2]);
  }

  const background = safeImage(
    s.BACKGROUND_IMAGE_URL
  );

  document.body.style.backgroundImage =
    background ? `url("${background}")` : "none";

  document.body.style.backgroundSize = "cover";
  document.body.style.backgroundAttachment = "fixed";

  const styleId = "eah-dynamic-style";

  let style = $(styleId);

  if(!style) {
    style = el("style");
    style.id = styleId;
    document.head.appendChild(style);
  }

  const titleColor = safeColor(
    s.TITLE_COLOR,theme[4]
  );

  const titleSize = numeric(
    s.TITLE_SIZE,38,18,72
  );

  const heroSize = numeric(
    s.HERO_TITLE_SIZE ||
    s.COVER_TEXT_SIZE,
    52,24,100
  );

  const cardSize = numeric(
    s.CARD_TITLE_SIZE,23,12,42
  );

  style.textContent = `
    .page h2 {
      color:${titleColor};
      font-size:${titleSize}px;
    }
    .card h3 {
      color:${titleColor};
      font-size:${cardSize}px;
    }
    .hero h1 {
      font-size:clamp(30px,5vw,${heroSize}px);
    }
  `;
}

function renderHeader() {
  if(!state.club) return;

  const cfg = state.config;
  const c = state.club;
  const s = object(cfg.settings);

  applyTheme();

  const title =
    cfg.site_title ||
    c.name ||
    "EAH Diving Club";

  document.title = title;

  $("club-brand").textContent = title;
  $("footer-name").textContent = title;

  $("footer-text").textContent =
    s.FOOTER_TEXT ||
    "Propulsé par EAH Diving";

  const logo = safeImage(
    cfg.logo_url || c.logo_url
  );

  const logoEl = $("club-logo");

  logoEl.hidden = !logo;

  if(logo) logoEl.src = logo;

  logoEl.onerror = () => {
    logoEl.hidden = true;
  };

  const heroTitle = String(
    s.HERO_TITLE || ""
  ).trim();

  $("hero-title").textContent = heroTitle;
  $("hero-title").hidden = !heroTitle;

  $("hero-tagline").textContent =
    cfg.tagline ||
    c.welcome_text ||
    "";

  const page = state.pages.find(
    p => String(p.slug).toLowerCase() ===

  );

  const ps = object(page?.settings);

  const cover = safeImage(
    ps.cover_url ||
    ps.cover_image_url ||
    cfg.hero_url ||
    ""
  );

  $("hero").style.backgroundImage =

  $("hero").style.minHeight =

}

/* ==========================================
   MODALES ET GALERIES
========================================== */

function openModal(title,builder) {
  document.querySelector(".modal")?.remove();

  const overlay = el("div","modal");
  const box = el("div","modal-window");

  box.setAttribute("role","dialog");
  box.setAttribute("aria-modal","true");

  const close = button("✕",() => {
    overlay.remove();
  });

  close.className = "modal-close";

  box.appendChild(close);
  box.appendChild(el("h2","",title));

  builder(box);

  overlay.appendChild(box);
  document.body.appendChild(overlay);

  overlay.addEventListener("click",event => {
    if(event.target === overlay)
      overlay.remove();
  });

  const escapeHandler = event => {
    if(event.key === "Escape") {
      overlay.remove();
      document.removeEventListener(
        "keydown",escapeHandler
      );
    }
  };

  document.addEventListener(
    "keydown",escapeHandler
  );

  close.focus();
}

function gallery(parent,photos,title) {
  const urls = [...new Set(
    array(photos)
      .map(safeImage)
      .filter(Boolean)
  )];

  if(!urls.length) return;

  const main = image(
    parent,urls[0],title,"modal-media"
  );

  if(urls.length < 2) return;

  const thumbs = el("div","gallery");

  urls.forEach((url,index) => {
    const b = button(
      "Photo " + (index+1),
      () => {main.src = url}
    );

    b.textContent = "";

    image(
      b,url,
      "Photo " + (index+1)
    );

    thumbs.appendChild(b);
  });

  parent.appendChild(thumbs);
}

/* ==========================================
   DISCIPLINES
========================================== */

function renderDisciplines(page,section) {
  const disciplines = array(
    object(page.settings).disciplines
  );

  if(!disciplines.length) {
    section.appendChild(
      el("p","empty","Aucune discipline disponible.")
    );
    return;
  }

  const grid = el("div","cards");

  disciplines.forEach(d => {
    if(d.active === false) return;

    const name =
      d.nom || d.name || "Discipline";

    const picture =
      d.image_url ||
      d.photo_illustration_url ||
      d.photo_url;

    const card = el("article","card");

    const open = () => {
      openModal(name,box => {
        gallery(box,[picture],name);

        description(
          box,
          d.description_longue ||
          d.description
        );

        const tarifs = array(d.tarifs).length
          ? d.tarifs
          : [1,2,3].map(n => ({
              titre:"Tarif " + n,
              prix:d["tarif_" + n],
              description:
                d["description_tarif_" + n]
            }));

        tarifs.forEach(t => {
          if(!t.prix && !t.description) return;

          const line = el("div","detail-line");

          line.appendChild(
            el("h3","",t.titre || "Tarif")
          );

          if(t.prix) {
            line.appendChild(
              el("p","price",String(t.prix) + " €")
            );
          }

          description(line,t.description);
          box.appendChild(line);
        });

        if(d.tarif || d.prix) {
          box.appendChild(
            el(
              "p","price",
              "Tarif : " + (d.tarif || d.prix)
            )
          );
        }

        video(box,d.video_url);
      });
    };

    const img = image(card,picture,name);

    if(img) {
      img.style.cursor = "pointer";
      img.addEventListener("click",open);
    }

function addToCart(product,size) {
  const stock = Number(product.stock);

  const available =
    Number.isFinite(stock) && stock >= 0
      ? stock : 0;

  const id = product.id || product.name;

  const already = state.cart
    .filter(x => x.id === id)
    .reduce(
      (sum,x) => sum + x.quantity,
      0
    );

  if(already >= available) {
    alert("Stock disponible atteint.");
    return false;
  }

  const existing = state.cart.find(
    x => x.id === id && x.size === size
  );

  if(existing) {
    existing.quantity++;
  } else {
    state.cart.push({
      id:id,
      name:product.name,
      price:Number(product.price || 0),
      size:size,
      quantity:1
    });
  }

  return true;
}

function renderCart(container) {
  container.replaceChildren();

  container.appendChild(
    el("h3","","Mon panier")
  );

  if(!state.cart.length) {
    container.appendChild(
      el("p","muted","Votre panier est vide.")
    );
    return;
  }

  state.cart.forEach((item,index) => {
    const line = el("div","cart-line");

    line.appendChild(
      el(
        "span","",
        item.name +
        (item.size ? " — " + item.size : "") +
        " × " + item.quantity +
        " : " + money(
          item.price * item.quantity
        )
      )
    );

    line.appendChild(
      button("Retirer",() => {
        state.cart.splice(index,1);
        renderCart(container);
      })
    );

    container.appendChild(line);
  });

  const total = state.cart.reduce(
    (sum,x) => sum + x.price*x.quantity,
    0
  );

  container.appendChild(
    el(
      "h3","",
      "Total indicatif : " + money(total)
    )
  );

  container.appendChild(
    el(
      "p","muted",
      "La validation des commandes nécessite " +
      "un contrôle serveur des prix et des stocks."
    )
  );
}

async function refreshMember() {
  if(!state.sb || !state.club) return;

  const result = await state.sb.auth.getUser();

  state.user = result.data?.user || null;
  state.member = null;

  if(!state.user) return;

  const response = await state.sb
    .from("club_members")
    .select("*")
    .eq("club_id",state.club.id)
    .eq("user_id",state.user.id)
    .eq("active",true)
    .maybeSingle();

  if(response.error) {
    console.warn(
      "Accès club :",response.error.message
    );
    return;
  }

  state.member = response.data;
}

function isManager() {
  return Boolean(
    state.member &&
    MANAGER_ROLES.includes(
      String(
        state.member.role || ""
      ).toLowerCase()
    )
  );
}

function field(parent,title,type,required=true) {
  const label = el("label","",title);
  const input = el("input");

  input.type = type;
  input.required = required;

  label.appendChild(input);
  parent.appendChild(label);

  return input;
}

function renderClubSpace(section) {
  const box = el("div","panel");
  section.appendChild(box);

  if(!state.sb) {
    message(
      box,
      "Service de connexion indisponible.",
      true
    );
    return;
  }

  if(!state.user) {
    description(
      box,
      "Connectez-vous avec vos identifiants EAH Diving."
    );

    const form = el("form","form");

    const email = field(
      form,"Adresse e-mail","email"
    );

    const password = field(
      form,"Mot de passe","password"
    );

    const submit = el(
      "button","primary-button","Se connecter"
    );

    submit.type = "submit";

    const feedback = el("div");

    form.append(submit,feedback);
    box.appendChild(form);

    form.addEventListener(
      "submit",
      async event => {
        event.preventDefault();
        submit.disabled = true;

        try {
          const result =
            await state.sb.auth.signInWithPassword({
              email:email.value.trim(),
              password:password.value
            });

          if(result.error)
            throw result.error;

          await refreshMember();
          renderPages("espace-club");

        } catch(error) {
          message(
            feedback,error.message,true
          );
        } finally {
          submit.disabled = false;
        }
      }
    );

    return;
  }

  if(!state.member) {
    message(
      box,
      "Votre compte est connecté, mais aucun " +
      "accès actif à ce club n'a été confirmé.",
      true
    );

    box.appendChild(
      button("Se déconnecter",async () => {
        await state.sb.auth.signOut();
        await refreshMember();
        renderPages("espace-club");
      })
    );

    return;
  }

  box.appendChild(
    el(
      "h3","",
      "Bienvenue " +
      (
        state.member.display_name ||
        state.user.email ||
        ""
      )
    )
  );

  description(
    box,
    "Club : " + state.club.name +
    " — Rôle : " + state.member.role
  );

  box.appendChild(
    button("Se déconnecter",async () => {
      await state.sb.auth.signOut();
      await refreshMember();
      renderPages("espace-club");
    })
  );

  if(isManager()) {
    renderManager(section);
  }
}

/* ==========================================
   ADMINISTRATION CLUB
========================================== */

function renderManager(section) {
  const box = el("div","panel");
  box.style.marginTop = "20px";

  box.appendChild(
    el("h3","","Personnaliser mon club")
  );

  description(
    box,
    "Importez votre logo JPG, PNG ou WebP " +
    "(maximum 3 Mo)."
  );

  const input = el("input");
  input.type = "file";
  input.accept = "image/png,image/jpeg,image/webp";

  const preview = el("img");
  preview.style.maxWidth = "180px";
  preview.style.maxHeight = "180px";
  preview.hidden = true;

  const feedback = el("div");

  input.addEventListener("change",() => {
    const file = input.files?.[0];
    if(!file) return;

    preview.src = URL.createObjectURL(file);
    preview.hidden = false;
  });

  const save = button(
    "Enregistrer mon logo",
    async () => {
      const file = input.files?.[0];

      if(!file) {
        message(
          feedback,"Sélectionnez une image.",true
        );
        return;
      }

      if(![
        "image/png",
        "image/jpeg",
        "image/webp"
      ].includes(file.type)) {
        message(
          feedback,"Format incorrect.",true
        );
        return;
      }

      if(file.size > 3*1024*1024) {
        message(
          feedback,"Fichier supérieur à 3 Mo.",true
        );
        return;
      }

      save.disabled = true;

      try {
        await refreshMember();

        if(!isManager())
          throw new Error("Accès non autorisé.");

        const ext = {
          "image/png":"png",
          "image/jpeg":"jpg",
          "image/webp":"webp"
        }[file.type];

        const unique =
          typeof crypto.randomUUID === "function"
            ? crypto.randomUUID()
            : String(Date.now());

        const path =
          state.club.id +
          "/logo-" + unique + "." + ext;

        const upload = await state.sb.storage
          .from("eah-club-logos")
          .upload(path,file,{
            contentType:file.type,
            upsert:false
          });

        if(upload.error)
          throw upload.error;

        const publicUrl = state.sb.storage
          .from("eah-club-logos")
          .getPublicUrl(path).data.publicUrl;

        const update = await state.sb
          .from("eah_club_site_config")
          .update({logo_url:publicUrl})
          .eq("club_id",state.club.id)
          .select("club_id,logo_url");

        if(update.error)
          throw update.error;

        if(!update.data?.length)
          throw new Error(
            "Mise à jour refusée. Vérifiez les autorisations RLS."
          );

        state.config.logo_url = publicUrl;
        renderHeader();

        message(
          feedback,"Logo enregistré avec succès."
        );

      } catch(error) {
        message(feedback,error.message,true);
      } finally {
        save.disabled = false;
      }
    },
    true
  );

  box.append(
    input,preview,save,feedback
  );

  section.appendChild(box);

  const admin = el("div","panel");
  admin.style.marginTop = "20px";

  admin.appendChild(
    el("h3","","Administration du club")
  );

  description(
    admin,
    "Articles publics : " + state.products.length
  );

  const orders = el("div");

  orders.appendChild(
    el("h4","","Dernières commandes")
  );

  admin.appendChild(orders);
  section.appendChild(admin);

  state.sb
    .from("eah_club_orders")
    .select(
      "id,customer_name,total,status,payment_status,created_at"
    )
    .eq("club_id",state.club.id)
    .order("created_at",{ascending:false})
    .limit(20)
    .then(result => {
      if(result.error) {
        orders.appendChild(
          el(
            "p","status error",
            result.error.message
          )
        );
        return;
      }

      if(!result.data?.length) {
        orders.appendChild(
          el("p","muted","Aucune commande.")
        );
        return;
      }

      result.data.forEach(order => {
        orders.appendChild(
          el(
            "p","",
            new Date(
              order.created_at
            ).toLocaleDateString("fr-FR") +
            " — " + order.customer_name +
            " — " + money(order.total) +
            " — " + order.status
          )
        );
      });
    });
}

/* ==========================================
   MENU ET NAVIGATION
========================================== */

function showPage(slug) {
  const target = String(
    slug || ""
  ).toLowerCase();

  const exists = state.pages.some(
    p => String(p.slug).toLowerCase() === target
  );

  if(!exists) return;

  state.currentPage = target;

  document.querySelectorAll(".page")
    .forEach(section => {
      section.classList.toggle(
        "active",
        section.dataset.slug === target
      );
    });

  document.querySelectorAll("#menu button")
    .forEach(b => {
      b.classList.toggle(
        "active",
        b.dataset.slug === target
      );
    });

  renderHeader();

  const hash = "#" + encodeURIComponent(target);

  if(location.hash !== hash) {
    history.replaceState(
      null,"",
      location.pathname + location.search + hash
    );
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function renderPages(preferred) {
  const menu = $("menu");
  const pages = $("pages");

  menu.replaceChildren();
  pages.replaceChildren();

  state.pages.forEach(page => {
    const slug = String(
      page.slug || ""
    ).toLowerCase();

    const nav = button(
      page.title || slug,
      () => showPage(slug)
    );

    nav.dataset.slug = slug;
    menu.appendChild(nav);

    const section = el("section","page");
    section.dataset.slug = slug;

    section.appendChild(
      el("h2","",page.title || slug)
    );

    try {
      if(slug === "boutique") {
        renderBoutique(page,section);
      } else if(slug === "espace-club") {
        renderClubSpace(section);
      } else {
        renderStandard(page,section);
      }
    } catch(error) {
      console.error("Page :",slug,error);

      section.appendChild(
        el(
          "p","status error",
          "Erreur dans cette rubrique : " +
          error.message
        )
      );
    }

    pages.appendChild(section);
  });

  let requested =
    preferred ||
    state.currentPage ||
    decodeURIComponent(
      location.hash.slice(1)
    );

  const exists = state.pages.some(
    p => String(p.slug).toLowerCase() === requested
  );

  if(!exists) {
    requested = String(
      state.pages[0].slug
    ).toLowerCase();
  }

  showPage(requested);
}

   EAH DIVING CLUB - NFC V8
   Email + récupération + photo Google Drive
========================================== */

function nfcMode() {
  $("loading").hidden = true;
  $("app").hidden = false;

  $("app").querySelector("header").hidden = true;
  $("hero").hidden = true;
  $("app").querySelector("footer").hidden = true;

  const pages = $("pages");
  pages.replaceChildren();
  pages.style.maxWidth = "720px";
  pages.style.margin = "auto";

  return pages;
}

function nfcRedirect() {
  const url = new URL(location.href);
  url.hash = "";
  url.searchParams.delete("code");
  url.searchParams.delete("error");
  url.searchParams.delete("error_description");
  return url.toString();
}

function nfcPhotoUrl(value) {
  const raw = String(value || "").trim();
  if (!raw) return "";

  const patterns = [
    /drive\.google\.com\/file\/d\/([\w-]+)/i,
    /drive\.google\.com\/open\?[^#]*[?&]id=([\w-]+)/i,
    /drive\.google\.com\/uc\?[^#]*[?&]id=([\w-]+)/i,
    /drive\.google\.com\/thumbnail\?[^#]*[?&]id=([\w-]+)/i,
    /docs\.google\.com\/(?:document|presentation|spreadsheets)\/d\/([\w-]+)/i
  ];

  let id = "";

  for (const pattern of patterns) {
    const match = raw.match(pattern);
    if (match) {
      id = match[1];
      break;
    }
  }

  if (!id && /^[\w-]{20,}$/.test(raw)) {
    id = raw;
  }

  if (id) {
    return "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(id) + "&sz=w1000";
  }

  try {
    const url = new URL(raw);
    if (url.protocol !== "https:") return "";
    return url.href;
  } catch (_) {
    return "";
  }
}

async function nfcLookup() {

async function nfcActivate(first, last, id) {

      p_token: NFC_TOKEN,

      p_eah_id: id || null
    }
  );

  if (error) throw error;
  return data;
}

async function nfcUploadPhoto(file) {
  if (!file) return null;

  const types = {
    "image/jpeg": "jpg",
    "image/png": "png",
    "image/webp": "webp"
  };

  if (!types[file.type]) {
    throw new Error("Utilisez JPG, PNG ou WebP.");
  }

  if (file.size > 3 * 1024 * 1024) {
    throw new Error("Photo supérieure à 3 Mo.");
  }

  const { data: auth, error: authError } =
    await state.sb.auth.getUser();

  if (authError || !auth?.user) {
    throw new Error("Connexion nécessaire pour envoyer la photo.");
  }

  const unique = crypto.randomUUID();
  const path = auth.user.id + "/" + unique + "." + types[file.type];

  const { error } = await state.sb.storage
    .from("eah-nfc-profiles")
    .upload(path, file, {
      contentType: file.type,
      upsert: false
    });

  if (error) throw error;

  return state.sb.storage
    .from("eah-nfc-profiles")
    .getPublicUrl(path).data.publicUrl;
}

async function nfcSaveDetails(groupId, coachId, file, driveUrl) {
  let photoUrl = null;

  if (file) {
    photoUrl = await nfcUploadPhoto(file);
  } else if (driveUrl) {
    photoUrl = nfcPhotoUrl(driveUrl);
    if (!photoUrl) {
      throw new Error("Lien de photo invalide.");
    }
  }

  const { error } = await state.sb.rpc(
    "eah_nfc_details_v7", {
      p_club_slug: CLUB_SLUG,
      p_token: NFC_TOKEN,
      p_group_id: groupId || null,
      p_coach_id: coachId || null,
      p_photo_url: photoUrl
    }
  );

  if (error) throw error;
}

function nfcSelect(parent, title, items) {
  const label = el("label", "", title);
  const select = el("select");

  const empty = el("option", "", "Sélectionner...");
  empty.value = "";
  select.appendChild(empty);

  items.forEach(item => {
    const option = el("option", "", item.name || "Sans nom");
    option.value = item.id;
    select.appendChild(option);
  });

  label.appendChild(select);
  parent.appendChild(label);
  return select;
}

function nfcPendingKey() {
  return "eah_nfc_pending_" + CLUB_SLUG + "_" + NFC_TOKEN;
}


function nfcSavePending(data) {
  localStorage.setItem(
    nfcPendingKey(),
    JSON.stringify(data)
  );
}

function nfcReadPending() {
  try {
    const raw =
      localStorage.getItem(nfcPendingKey()) ||
      sessionStorage.getItem(nfcPendingKey());

    return raw ? JSON.parse(raw) : null;
  } catch (error) {
    console.warn("Données NFC :", error);
    return null;
  }
}

function nfcClearPending() {
  localStorage.removeItem(nfcPendingKey());
  sessionStorage.removeItem(nfcPendingKey());
}

    let previewUrl = null;

    function updatePhotoPreview() {
      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }

      const file = photoInput.files?.[0];

      if (file) {
        previewUrl = URL.createObjectURL(file);
        preview.src = previewUrl;
        preview.hidden = false;
        return;
      }

      const drive = nfcPhotoUrl(driveInput.value);

      if (drive) {
        preview.src = drive;
        preview.hidden = false;
      } else {

      }
    }

    photoInput.addEventListener("change", updatePhotoPreview);
    driveInput.addEventListener("input", updatePhotoPreview);

async function finishActivation() {
  const { data, error } = await state.sb.auth.getUser();

  if (error) throw error;

  const user = data?.user;

  if (!user) {
    throw new Error("Connexion au compte nécessaire.");
  }

  if (!user.email_confirmed_at) {
    throw new Error("Confirmez votre adresse e-mail.");
  }

  const saved = nfcReadPending() || {};

  const prenom = (
    saved.first || first.value || ""
  ).trim();

  const nom = (
    saved.last || last.value || ""
  ).trim();

  const identifiant = (
    saved.id || id.value || ""
  ).trim();

  const adresse = (
    saved.email || email.value || ""
  ).trim().toLowerCase();

  if (!prenom || !nom) {
    throw new Error(
      "Prénom et nom manquants. Complétez le formulaire."
    );
  }

  if (
    adresse &&
    user.email?.toLowerCase() !== adresse
  ) {
    throw new Error(
      "L'adresse du compte ne correspond pas au profil."
    );
  }

  const existing = await nfcProfile();

  if (
    String(existing?.status || "").toUpperCase()
    !== "ACTIVE"
  ) {
    const result = await nfcActivate(
      prenom,
      nom,
      identifiant
    );

    console.info("EAH ID enregistré :", result);
  } else {
    const card = await nfcLookup();

    if (
      String(card?.card_status).toUpperCase() === "ACTIVE"
    ) {
      console.info("Carte déjà activée.");
    }
  }

  const groupe = saved.groupId || group.value || null;
  const entraineur = saved.coachId || coach.value || null;
  const drive = saved.driveUrl ||
    driveInput.value.trim() || "";

  try {
    await nfcSaveDetails(
      groupe,
      entraineur,
      photoInput.files?.[0] || null,
      drive
    );
  } catch (detailsError) {
    throw new Error(
      "Le compte est activé, mais les informations " +
      "complémentaires n'ont pas été enregistrées : " +
      detailsError.message
    );
  }

  const profile = await nfcProfile();

  if (
    String(profile?.status || "").toUpperCase()
    !== "ACTIVE"
  ) {
    throw new Error(
      "L'activation du profil n'a pas été confirmée."
    );
  }

  if (
    identifiant &&
    String(profile.eah_id).toUpperCase() !==
    identifiant.toUpperCase()
  ) {
    throw new Error(
      "L'identifiant enregistré ne correspond pas " +
      "à l'identifiant personnalisé demandé."
    );
  }

  nfcClearPending();

  await renderNfc();
}

    
/* ==========================================================

const EAH_AUTH_REDIRECT = nfcRedirect();

async function EAH_SEND_ACCESS_LINK() {
  if (!state.sb) {
    throw new Error("Connexion Supabase indisponible.");
  }

  const adresse = email.value.trim().toLowerCase();

  if (!adresse || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(adresse)) {
    throw new Error("Saisissez une adresse e-mail valide.");
  }

  savePendingForm();

  const { data: currentData, error: currentError } =
    await state.sb.auth.getUser();

  if (currentError && currentError.name !== "AuthSessionMissingError") {
    throw currentError;
  }

  const currentUser = currentData?.user;

  if (currentUser) {
    if (currentUser.email?.toLowerCase() !== adresse) {
      throw new Error(
        "Un autre compte est connecté. Déconnectez-le d'abord."
      );
    }

    await finishActivation();
    return "activated";
  }

  const { error } = await state.sb.auth.signInWithOtp({
    email: adresse,
    options: {
      shouldCreateUser: true,
      emailRedirectTo: EAH_AUTH_REDIRECT,
      data: {
        first_name: first.value.trim(),
        last_name: last.value.trim(),
        eah_id_requested: id.value.trim(),
        nfc_club_slug: CLUB_SLUG
      }
    }
  });

  if (error) {
    if (error.status === 429) {
      throw new Error(
        "Trop de demandes. Attendez quelques minutes."
      );
    }

    throw new Error(
      "Impossible de demander le lien : " + error.message
    );
  }

  return "sent";
}

async function renderNfcRecovery() {
  const pages = nfcMode();
  const panel = el("section", "panel");

  panel.appendChild(
    el("h2", "", "Définir mon nouveau mot de passe")
  );

  const form = el("form", "form");
  const password = field(form, "Nouveau mot de passe", "password");
  password.minLength = 8;

  const confirm = field(form, "Confirmer le mot de passe", "password");
  confirm.minLength = 8;

  const submit = el("button", "primary-button", "Enregistrer");
  submit.type = "submit";

  const feedback = el("div");
  form.append(password, confirm, submit, feedback);
  panel.appendChild(form);
  pages.appendChild(panel);

  form.addEventListener("submit", async event => {
    event.preventDefault();
    submit.disabled = true;

    try {
      if (password.value !== confirm.value) {
        throw new Error("Les mots de passe ne correspondent pas.");
      }

      const { data, error: sessionError } =
        await state.sb.auth.getSession();

      if (sessionError) throw sessionError;
      if (!data.session) {
        throw new Error("Lien expiré ou invalide. Demandez un nouveau lien.");
      }

      const { error } = await state.sb.auth.updateUser({
        password: password.value
      });

      if (error) throw error;

      message(feedback, "Mot de passe enregistré avec succès.");

      const link = el("a", "primary-button", "Continuer vers mon profil");
      link.href = nfcRedirect();
      link.style.display = "inline-block";
      panel.appendChild(link);

    } catch (error) {
      message(feedback, error.message, true);
    } finally {
      submit.disabled = false;
    }
  });
}

function nfcIsRecovery() {
  const hash = new URLSearchParams(location.hash.slice(1));
  return hash.get("type") === "recovery";
}
