<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03131f">
<title>EAH Diving Club</title>

<style>
:root{
  --primary:#0b6bff;
  --secondary:#03131f;
  --text:#fff;
  --muted:#b8cadb;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--secondary);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
a{color:inherit}
[hidden]{display:none!important}
header{
  position:sticky;
  top:0;
  z-index:10;
  padding:16px 24px;
  background:var(--secondary);
  border-bottom:1px solid #ffffff25;
}
.header-inner{
  max-width:1400px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:20px;
  font-weight:800;
}
.brand img{width:54px;height:54px;object-fit:contain}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button,.secondary-button{
  padding:12px 16px;
  background:transparent;
  border:1px solid #ffffff35;
  color:white;
  border-radius:10px;
}
nav button.active,nav button:hover,.primary-button{
  background:var(--primary);
  border-color:var(--primary);
  color:white;
}
.primary-button{
  padding:12px 18px;
  border:0;
  border-radius:10px;
  font-weight:bold;
}
.hero{
  min-height:360px;
  padding:65px 25px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background-size:cover;
  background-position:center;
  position:relative;
}
.hero:before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,12,24,.58);
}
.hero-content{position:relative;max-width:1000px}
.hero h1{
  font-size:clamp(34px,6vw,75px);
  margin:0 0 20px;
}
.hero p{
  font-size:clamp(17px,2vw,24px);
  color:#e3edf5;
}
main{max-width:1250px;margin:auto;padding:40px 20px 80px}
.page{display:none}
.page.active{display:block}
.page h2{font-size:clamp(28px,4vw,43px)}
.page-description{
  color:var(--muted);
  line-height:1.7;
  white-space:pre-line;
}
.page-image{
  width:100%;
  max-height:560px;
  object-fit:cover;
  border-radius:15px;
  margin:20px 0;
}
.page-video{
  width:100%;
  max-width:900px;
  display:block;
  margin:20px auto;
}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
  margin-top:25px;
}
.card,.panel{
  background:#ffffff0b;
  border:1px solid #ffffff25;
  border-radius:15px;
  padding:20px;
}
.card img{
  width:100%;
  height:210px;
  object-fit:contain;
}
.card h3{margin:12px 0}
.muted{color:var(--muted)}
.price{font-size:23px;font-weight:bold}
.form{
  display:grid;
  gap:14px;
  max-width:560px;
}
input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ffffff40;
  border-radius:9px;
  color:white;
  background:#112b40;
}
input::placeholder{color:#aec0ce}
label{display:grid;gap:6px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.status{
  padding:13px;
  border-radius:9px;
  background:#ffffff12;
  margin:15px 0;
  white-space:pre-line;
}
.error{border:1px solid #ff6c6c;color:#ffd1d1}
.success{border:1px solid #45c98a}
.empty{
  padding:22px;
  color:var(--muted);
  border:1px solid #ffffff20;
  border-radius:12px;
}
.cart-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #ffffff25;
  padding:12px 0;
}
.cart-line button{padding:8px}
footer{
  text-align:center;
  padding:30px;
  border-top:1px solid #ffffff20;
  color:var(--muted);
}
#loading{
  min-height:100vh;
  display:grid;
  place-items:center;
  text-align:center;
  font-size:24px;
}
@media(max-width:700px){
  header{padding:12px}
  .header-inner{justify-content:center}
  nav{justify-content:center}
  nav button{padding:10px;font-size:14px}
  .hero{min-height:290px}
}
  
/* EAH — BOUTIQUE : CARTES COMPACTES */

.cards {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(min(100%, 240px), 280px));
  gap: 20px;
  align-items: start;
}

.card {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px;
}

.card img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 280px;
  aspect-ratio: 1 / 1;
  object-fit: contain;
}

.card h3,
.card .price {
  margin: 4px 0;
}

.card .muted {
  margin: 4px 0;
}

.card button {
  align-self: flex-start;
}

.hero::before {
  display: none !important;
}

@media (max-width: 620px) {
  .cards {
    grid-template-columns:
      repeat(auto-fit, minmax(150px, 1fr));
  }

  .card {
    padding: 12px;
  }

  .card img {
    max-height: 220px;
  }
}

/* EAH V23 - PERSONNALISATION PREMIUM */

body {
  background-color: var(--eah-background, #071725);
  color: var(--eah-text, #E8F2FF);
  font-family: var(--eah-font, Arial, sans-serif);

h1, h2, h3 {

h1 {

button.active,

/* EAH V24 — THÈMES AUTOMATIQUES */

body {
  background: var(--eah-background, #071725);
  color: var(--eah-text, #FFFFFF);
  font-family: var(--eah-font, Arial, sans-serif);

}

/* Style 2 : Prestige */
html[data-eah-style="2"] .eah-hero-premium h1 {

</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
(function(){
"use strict";

/* =========================================
   EAH DIVING CLUB V3
   SITE PERSONNALISABLE MULTICLUB
   BOUTIQUE + AUTHENTIFICATION
========================================= */

const SUPABASE_URL =
  "https://limyeqpdzjjwsdximehp.supabase.co";

const PUBLIC_KEY =
  "sb_publishable_K9iUm_0Qhea65P1Zt6rbXQ_BXQCzJ9w";

const DEFAULT_CLUB =
  "eah-club-demo-1793054157740";

const params = new URLSearchParams(location.search);

const CLUB_SLUG =
  params.get("club") ||
  params.get("eah_club_preview") ||
  DEFAULT_CLUB;

const $ = id => document.getElementById(id);

const sb = window.supabase.createClient(
  SUPABASE_URL,
  PUBLIC_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

const state = {
  club:null,
  config:{},
  pages:[],
  badges:[],
  products:[],
  cart:[],
  user:null,
  member:null,
  currentPage:""
};

const MANAGER_ROLES = [
  "admin",
  "owner",
  "manager",
  "responsable"
];

function element(tag,className,text){
  const e=document.createElement(tag);
  if(className)e.className=className;
  if(text!==undefined)e.textContent=String(text??"");
  return e;
}

function safeImage(value) {

  if (!value) return "";

  const raw = String(value).trim();

  // Reconnaissance des liens Google Drive
  const match = raw.match(
    /(?:drive\.google\.com\/file\/d\/|drive\.google\.com\/open\?id=|drive\.google\.com\/uc\?(?:[^#]*&)?id=)([a-zA-Z0-9_-]{20,})/
  );

  if (match) {
    return (
      "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(match[1]) +
      "&sz=w1000"
    );
  }

  // Reconnaissance d'un identifiant Drive seul
  if (/^[a-zA-Z0-9_-]{20,}$/.test(raw)) {
    return (
      "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(raw) +
      "&sz=w1000"
    );
  }

  // URL classique
  try {
    const u = new URL(raw, location.href);

    if (["https:", "http:"].includes(u.protocol)) {
      return u.href;
    }

  } catch (e) {}

  return "";
}


function safeColor(value, fallback) {
  const colors = {
    "bleu": "#0B6BFF",
    "bleu marine": "#102040",
    "bleu clair": "#70C8FF",
    "orange": "#FF9800",
    "vert": "#23A455",
    "rouge": "#E53935",
    "blanc": "#FFFFFF",
    "noir": "#000000",
    "gris": "#808080",
    "jaune": "#FFD600",
    "rose": "#FF69B4",
    "violet": "#9333EA"
  };

  const valueText = String(value ?? "").trim();
  const key = valueText.toLowerCase();

  if (colors[key]) return colors[key];

  if (/^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(valueText)) {
    return valueText;
  }

  return fallback;
}


function money(value){
  return Number(value||0).toLocaleString(
    "fr-FR",
    {style:"currency",currency:"EUR"}
  );
}

function message(container,text,isError=false){
  container.replaceChildren();
  const e=element(
    "div",
    "status "+(isError?"error":"success"),
    text
  );
  container.appendChild(e);
}

function button(label,handler,primary=false){
  const b=element(
    "button",
    primary?"primary-button":"secondary-button",
    label
  );
  b.type="button";
  b.addEventListener("click",handler);
  return b;
}

async function publicQuery(table,query){
  const response=await fetch(
    SUPABASE_URL+"/rest/v1/"+table+"?"+query,
    {
      headers:{
        apikey:PUBLIC_KEY,
        Authorization:"Bearer "+PUBLIC_KEY,
        Accept:"application/json"
      },
      cache:"no-store"
    }
  );
  if(!response.ok)
    throw new Error(
      table+" : HTTP "+response.status
    );
  return response.json();
}

async function loadClub(){
  const clubs=await publicQuery(
    "clubs",
    "select=*&slug=eq."+encodeURIComponent(CLUB_SLUG)
  );

  if(!clubs.length)
    throw new Error("Club introuvable : "+CLUB_SLUG);

  state.club=clubs[0];

  const id=encodeURIComponent(state.club.id);

  const results=await Promise.all([
    publicQuery(
      "eah_club_site_config",
      "select=*&club_id=eq."+id
    ),
    publicQuery(
      "eah_club_pages",
      "select=*&club_id=eq."+id+
      "&active=eq.true&order=sort_order.asc"
    ),
    publicQuery(
      "eah_club_badges",
      "select=*&club_id=eq."+id+
      "&active=eq.true&order=sort_order.asc"
    ),
    publicQuery(
      "eah_club_products",
      "select=*&club_id=eq."+id+
      "&active=eq.true&order=sort_order.asc"
    )
  ]);

  state.config=results[0][0]||{};
  state.pages=results[1]||[];
  state.badges=results[2]||[];
  state.products=results[3]||[];
}


function renderHeader() {
  const c = state.club;
  const cfg = state.config || {};
  const s = cfg.settings || {};

  const title = cfg.site_title || c.name || "EAH Diving Club";
  const heroTitle = s.HERO_TITLE || title;

  document.title = title;

  $("club-brand").textContent = title;
  $("hero-title").textContent = heroTitle;
  $("footer-name").textContent = title;

  $("hero-tagline").textContent =
    cfg.tagline || c.welcome_text || "";

  const root = document.documentElement;

  const primary = safeColor(
    s.PRIMARY_COLOR || cfg.primary_color || c.primary_color,
    "#0B6BFF"
  );

  const background = safeColor(
    s.BACKGROUND_COLOR || cfg.secondary_color,
    "#03131F"
  );

  root.style.setProperty("--primary", primary);
  root.style.setProperty("--secondary", background);
  root.style.setProperty(
    "--text", safeColor(s.TEXT_COLOR, "#FFFFFF")
  );

  document.body.style.backgroundColor = background;

  const header = document.querySelector("header");
  if (header) {
    header.style.backgroundColor =
      safeColor(s.HEADER_COLOR, "#061827");
  }

  const titleColor = safeColor(s.TITLE_COLOR, "#FFFFFF");

  const styleId = "eah-club-custom-style";
  let customStyle = document.getElementById(styleId);

  if (!customStyle) {
    customStyle = document.createElement("style");
    customStyle.id = styleId;
    document.head.appendChild(customStyle);
  }

const EAH_FONTS = {
  "Arial": "Arial, Helvetica, sans-serif",
  "Roboto": "Roboto, Arial, sans-serif",
  "Verdana": "Verdana, sans-serif",
  "Georgia": "Georgia, serif",
  "Tahoma": "Tahoma, sans-serif",
  "Times New Roman": "Times New Roman, serif"
};

const selectedFont = String(
  s.FONT_FAMILY || "Arial"
).trim();

const fontFamily =
  EAH_FONTS[selectedFont] || EAH_FONTS.Arial;

function EAH_FONT_SIZE(value, fallback, min, max) {
  if (value === "" || value == null) return fallback;

  const number = Number(value);

  return Number.isFinite(number) &&
    number >= min &&
    number <= max
      ? number
      : fallback;
}

const textSize = EAH_FONT_SIZE(s.TEXT_SIZE, 16, 10, 32);
const titleSize = EAH_FONT_SIZE(s.TITLE_SIZE, 36, 18, 72);
const heroTitleSize = EAH_FONT_SIZE(
  s.HERO_TITLE_SIZE, 56, 24, 100
);
const cardTitleSize = EAH_FONT_SIZE(
  s.CARD_TITLE_SIZE, 20, 12, 42
);

root.style.setProperty("--eah-font", fontFamily);
root.style.setProperty("--eah-text-size", textSize + "px");
root.style.setProperty("--eah-title-size", titleSize + "px");
root.style.setProperty(
  "--eah-hero-title-size",
  heroTitleSize + "px"
);
root.style.setProperty(
  "--eah-card-title-size",
  cardTitleSize + "px"
);

  const cardColor = safeColor(s.CARD_COLOR, "#102B42");

  customStyle.textContent = `
  
body, button, input, select, textarea {
  font-family: var(--eah-font);
}

body {
  font-size: var(--eah-text-size);
}

.hero h1 {
  font-size: var(--eah-hero-title-size);
  line-height: 1.15;
  overflow-wrap: anywhere;
}

.page h2 {
  font-size: var(--eah-title-size);
}

.card h3 {
  font-size: var(--eah-card-title-size);
}

    .hero h1, .page h2, .card h3 {
      color: ${titleColor};
    }
    .card, .panel {
      background-color: ${cardColor};
    }
  `;

  const logo = safeImage(cfg.logo_url || c.logo_url);
  const logoElement = $("club-logo");

  if (logo) {
    logoElement.src = logo;
    logoElement.hidden = false;
  } else {
    logoElement.hidden = true;
  }

  const heroElement = $("hero");

  const currentPage = state.pages.find(
  page => page.slug === state.currentPage
);

const heroImage = safeImage(
  currentPage?.image_url || cfg.hero_url
);
  const backgroundImage = safeImage(s.BACKGROUND_IMAGE_URL);

  heroElement.style.backgroundImage =
    heroImage ? `url("${heroImage}")` : "none";

  if (backgroundImage) {
    document.body.style.backgroundImage =
      `url("${backgroundImage}")`;
    document.body.style.backgroundSize = "cover";
    document.body.style.backgroundPosition = "center";
    document.body.style.backgroundAttachment = "fixed";
  } else {
    document.body.style.backgroundImage = "none";
  }

  const height = Number(s.HERO_HEIGHT);
  if (Number.isFinite(height) && height >= 200 && height <= 1000) {
    heroElement.style.minHeight = height + "px";
  }

  const overlay = Number(s.HERO_OVERLAY);
  if (Number.isFinite(overlay) && overlay >= 0 && overlay <= 1) {
    customStyle.textContent += `
      .hero::before {
        background: rgba(0, 12, 24, ${overlay});
      }
    `;
  }

  const footerText = document.querySelector("footer p");
  if (footerText) {
    footerText.textContent =
      s.FOOTER_TEXT || "Propulsé par EAH Diving";
  }
}

function renderBadges(section) {
  const grid = element("div", "cards");

  const page = state.pages.find(
    p => p.slug === "blazons"
  );

  const settings = page?.settings || {};

  const details = Array.isArray(
    settings.blazons_details
  ) ? settings.blazons_details : [];

  const criteres = Array.isArray(
    settings.criteres_blazons
  ) ? settings.criteres_blazons : [];

  if (!state.badges.length) {
    section.appendChild(
      element("p", "empty", "Aucun blazon disponible.")
    );
    return;
  }

  state.badges.forEach(badge => {
    const card = element("article", "card");

    const detail = details.find(
      b => String(b.id) === String(badge.badge_key)
    );

    const blazonV21 = (
  settings.blazons_v21 || []
).find(b => String(b.id) === String(badge.badge_key));

const imageUrl = safeImage(
  badge.image_url ||
  detail?.image_url ||
  blazonV21?.image_url ||
  ""
);

    if (imageUrl) {
      const img = element("img");
      img.src = imageUrl;
      img.alt = badge.name || "Blazon";
      img.loading = "lazy";
      card.appendChild(img);
    }

    card.appendChild(
      element("h3", "", badge.name)
    );

    const action = button("Voir les critères", () => {

function addToCart(product,size){
  const existing=state.cart.find(
    x=>x.id===product.id&&x.size===size
  );

  const already=state.cart
    .filter(x=>x.id===product.id)
    .reduce((sum,x)=>sum+x.quantity,0);

  if(already>=Number(product.stock)){
    alert("Stock disponible atteint.");
    return;
  }

  if(existing){
    existing.quantity++;
  }else{
    state.cart.push({
      id:product.id,
      name:product.name,
      price:Number(product.price),
      size,
      quantity:1
    });
  }
}

function renderCart(container){
  container.replaceChildren();
  container.appendChild(element("h3","","Mon panier"));

  if(!state.cart.length){
    container.appendChild(
      element("p","muted","Votre panier est vide.")
    );
    return;
  }

  state.cart.forEach((item,index)=>{
    const line=element("div","cart-line");

    line.appendChild(
      element(
        "span",
        "",
        item.name+
        (item.size?" — "+item.size:"")+
        " × "+item.quantity+
        " : "+money(item.price*item.quantity)
      )
    );

    line.appendChild(
      button("Retirer",()=>{
        state.cart.splice(index,1);
        renderCart(container);
      })
    );

    container.appendChild(line);
  });

  const total=state.cart.reduce(
    (sum,item)=>sum+item.price*item.quantity,
    0
  );

  container.appendChild(
    element("h3","","Total indicatif : "+money(total))
  );

  container.appendChild(
    element(
      "p",
      "muted",
      "La prise de commande sera activée après installation "+
      "du contrôle serveur des prix et des stocks."
    )
  );
}

async function refreshMember(){
  const result=await sb.auth.getUser();

  if(result.error){
    state.user=null;
    state.member=null;
    return;
  }

  state.user=result.data.user||null;
  state.member=null;

  if(!state.user)return;

  const response=await sb
    .from("club_members")
    .select("id,club_id,user_id,display_name,email,role,active")
    .eq("club_id",state.club.id)
    .eq("user_id",state.user.id)
    .eq("active",true)
    .maybeSingle();

  if(response.error){
    console.warn("Vérification club :",response.error.message);
    return;
  }

  state.member=response.data||null;
}

function isManager(){
  return Boolean(
    state.member &&
    MANAGER_ROLES.includes(
      String(state.member.role||"").toLowerCase()
    )
  );
}

function renderEspaceClub(section){
  const box=element("div","panel");
  section.appendChild(box);

  if(!state.user){
    box.appendChild(
      element(
        "p",
        "muted",
        "Connectez-vous avec vos identifiants EAH Diving."
      )
    );

    const form=element("form","form");

    const email=element("input");
    email.type="email";
    email.placeholder="Adresse e-mail";
    email.required=true;
    email.autocomplete="email";

    const password=element("input");
    password.type="password";
    password.placeholder="Mot de passe";
    password.required=true;
    password.autocomplete="current-password";

    const submit=element("button","primary-button","Se connecter");
    submit.type="submit";

    const feedback=element("div");

    form.append(email,password,submit,feedback);

    form.addEventListener("submit",async event=>{
      event.preventDefault();
      submit.disabled=true;

      const result=await sb.auth.signInWithPassword({
        email:email.value.trim(),
        password:password.value
      });

      submit.disabled=false;

      if(result.error){

          feedback,

  box.appendChild(

      "h3",

   Supabase Storage
   Réservé aux responsables connectés
===================================================== */

function EAH_LOGO_RENDER_UPLOAD(container) {

  if (!isManager()) return;

  const box = document.createElement("div");

  box.className = "panel";

  box.style.marginTop = "20px";

  const title = document.createElement("h3");
  title.textContent = "Personnaliser mon club";

  const description = document.createElement("p");

  description.textContent =
    "Importez votre logo JPG, PNG ou WebP " +
    "(maximum 3 Mo).";

  const input = document.createElement("input");

  input.type = "file";

  input.accept = "image/png,image/jpeg,image/webp";

  const preview = document.createElement("img");

  preview.alt = "Aperçu du logo";

  preview.style.maxWidth = "180px";
  preview.style.maxHeight = "180px";
  preview.style.objectFit = "contain";
  preview.style.display = "none";
  preview.style.margin = "15px 0";

  const save = document.createElement("button");

  save.type = "button";
  save.className = "primary-button";
  save.textContent = "Enregistrer mon logo";

  const feedback = document.createElement("p");

  let previewUrl = "";

  input.addEventListener("change", () => {

    if (previewUrl) {
      URL.revokeObjectURL(previewUrl);
      previewUrl = "";
    }

    const file = input.files[0];

    preview.style.display = "none";

    if (!file) return;

    if (![
      "image/png",
      "image/jpeg",
      "image/webp"
    ].includes(file.type)) {

      feedback.textContent =
        "Format non accepté.";

      input.value = "";
      return;
    }

    if (file.size > 3 * 1024 * 1024) {

      feedback.textContent =
        "Image trop volumineuse. Maximum 3 Mo.";

      input.value = "";
      return;
    }

    previewUrl = URL.createObjectURL(file);

    preview.src = previewUrl;
    preview.style.display = "block";

    feedback.textContent = "";

  });

  save.addEventListener("click", async () => {

    const file = input.files[0];

    if (!file) {

      feedback.textContent =
        "Sélectionnez d'abord une image.";

      return;
    }

    if (![
      "image/png",
      "image/jpeg",
      "image/webp"
    ].includes(file.type)) {

      feedback.textContent =
        "Format non accepté.";

      return;
    }

    if (file.size > 3 * 1024 * 1024) {

      feedback.textContent =
        "Image trop volumineuse.";

      return;
    }

    save.disabled = true;

    feedback.textContent =
      "Enregistrement en cours...";

    try {

      await refreshMember();

      if (!isManager()) {

        throw new Error(
          "Vous n'êtes pas autorisé à modifier ce club."
        );

      }

      const clubId = state.club.id;

      const extension = {
        "image/png": "png",
        "image/jpeg": "jpg",
        "image/webp": "webp"
      }[file.type];

      // Nouveau nom à chaque import pour éviter
      // les problèmes de cache navigateur.
      const fileName =
        clubId +
        "/logo-" +
        crypto.randomUUID() +
        "." +
        extension;

      const upload = await sb.storage
        .from("eah-club-logos")
        .upload(fileName, file, {
          contentType: file.type,
          cacheControl: "3600",
          upsert: false
        });

      if (upload.error) {
        throw upload.error;
      }

      const publicResult = sb.storage
        .from("eah-club-logos")
        .getPublicUrl(fileName);

      const logoUrl =
        publicResult.data.publicUrl;

      const update = await sb
        .from("eah_club_site_config")
        .update({
          logo_url: logoUrl
        })
        .eq("club_id", clubId)
        .select("club_id,logo_url");

      if (update.error) {
        throw update.error;
      }

      if (!update.data || update.data.length !== 1) {

        throw new Error(
          "Configuration du club non mise à jour. " +
          "Vérifiez les autorisations Supabase."
        );

      }

      state.config.logo_url = logoUrl;

      const headerLogo =
        document.getElementById("club-logo");

      if (headerLogo) {

        headerLogo.src = logoUrl;
        headerLogo.hidden = false;

        headerLogo.onerror = () => {
          headerLogo.hidden = true;
          feedback.textContent =
            "Logo enregistré, mais image inaccessible.";
        };

      }

      feedback.textContent =
        "Logo enregistré avec succès !";

    } catch (error) {

      console.error(
        "EAH LOGO :",
        error
      );

      feedback.textContent =
        "Erreur : " +
        (error.message || "Enregistrement impossible");

    } finally {

      save.disabled = false;

    }

  });

  box.appendChild(title);
  box.appendChild(description);
  box.appendChild(input);
  box.appendChild(preview);
  box.appendChild(save);
  box.appendChild(feedback);

  container.appendChild(box);

}

/* =========================================
   MENU DYNAMIQUE
========================================= */


function showPage(slug) {
  const target = String(slug || "").toLowerCase();

  const page = state.pages.find(
    p => String(p.slug).toLowerCase() === target
  );

  if (!page) {
    console.warn("Page introuvable :", target);
    return;
  }

  state.currentPage = target;

  document.querySelectorAll(".page").forEach(el => {
    el.classList.toggle(
      "active",
      el.dataset.slug === target
    );
  });

  document.querySelectorAll("#menu button").forEach(btn => {
    btn.classList.toggle(
      "active",
      btn.dataset.slug === target
    );
  });

  renderHeader();

  const hash = "#" + encodeURIComponent(target);

  if (location.hash !== hash) {
    history.replaceState(null, "", hash);
  }

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


function renderPages(preferredSlug){
  const menu=$("menu");
  const pages=$("pages");

  menu.replaceChildren();
  pages.replaceChildren();

  state.pages.forEach(page=>{
    const slug=String(page.slug||"").toLowerCase();
    renderHeader();

    const nav=button(
      page.title||slug,
      ()=>showPage(slug)
    );

    nav.dataset.slug=slug;
    menu.appendChild(nav);

    const section=element("section","page");
    section.dataset.slug=slug;

    section.appendChild(
      element("h2","",page.title||slug)
    );

    if(slug==="boutique"){
      renderBoutique(section);
    }else if(slug==="espace-club"){
      renderEspaceClub(section);
    }else{
      renderStandardPage(page,section);
    }

    pages.appendChild(section);
  });

  if(!state.pages.length){
    pages.appendChild(
      element("div","empty","Aucune page active.")
    );
    return;
  }

  const requested=preferredSlug||state.currentPage;

  const exists=state.pages.some(
    p=>String(p.slug).toLowerCase()===requested
  );

  showPage(
    exists
      ? requested
      : String(state.pages[0].slug).toLowerCase()
  );
}

  try{
    await loadClub();
    await refreshMember();

    renderHeader();
    renderPages();

    $("loading").hidden=true;
    $("app").hidden=false;

  }catch(error){
    console.error("EAH CLUB V3 :",error);

    $("loading").replaceChildren(
      element(
        "div",
        "status error",
        "Impossible de charger le club.\n"+
        (error.message||"Erreur inconnue")
      )
    );
  }
}

/* EAH V20 — Actualisation des données publiques */

let EAH_REFRESH_BUSY = false;

async function EAH_REFRESH_PUBLIC() {
  if (EAH_REFRESH_BUSY || !state.club) return;

  // Ne pas interrompre un panier ou un formulaire.
  if (
    state.cart.length ||
    document.activeElement?.matches(
      "input, textarea, select"
    )
  ) return;

  EAH_REFRESH_BUSY = true;

  try {
    const previousPage = state.currentPage;

    await loadClub();

    renderHeader();
    renderPages(previousPage);

    console.info(
      "EAH : données du club actualisées"
    );
  } catch (error) {
    console.error(
      "EAH : actualisation impossible",
      error
    );
  } finally {
    EAH_REFRESH_BUSY = false;
  }
}

// Actualisation automatique toutes les 60 secondes.

setInterval(() => {
  if (!document.hidden) {

  }
}, 60000);

const EAH21_COLORS = {
  "bleu": "#0B6BFF",
  "bleu marine": "#102040",
  "bleu clair": "#70C8FF",
  "orange": "#FF9800",
  "vert": "#23A455",

  "gris": "#808080",
  "jaune": "#FFD600",
  "rose": "#FF69B4",
  "violet": "#9333EA"
};

function EAH21_COLOR(value, fallback) {
  const v = String(value || "").trim();
  if (!v) return fallback;

  const normalized = v.toLowerCase();

  if (EAH21_COLORS[normalized]) {
    return EAH21_COLORS[normalized];
  }

  if (/^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(v)) {
    return v;
  }

  return fallback;
}

function EAH21_APPLY_THEME(config) {
  if (!config) return;

  const settings = config.settings || {};

  const primary = EAH21_COLOR(
    settings.PRIMARY_COLOR || config.primary_color,
    "#0B6BFF"
  );

  const background = EAH21_COLOR(
    settings.BACKGROUND_COLOR,
    "#03131F"
  );

  const text = EAH21_COLOR(
    settings.TEXT_COLOR,
    "#FFFFFF"
  );

  const root = document.documentElement;

  root.style.setProperty("--eah-primary", primary);
  root.style.setProperty("--eah-background", background);
  root.style.setProperty("--eah-text", text);

  document.body.style.backgroundColor = background;
  document.body.style.color = text;
}

/* ============================================================
   OUTILS
============================================================ */

function EAH28_TEXT(value) {
  return String(value == null ? "" : value).trim();
}

function EAH28_IMAGE(value) {
  return safeImage(value);
}

function EAH28_APPEND_TEXT(parent, tag, text, className) {
  if (!EAH28_TEXT(text)) return null;

  const node = document.createElement(tag);
  node.textContent = EAH28_TEXT(text);

  if (className) node.className = className;

  parent.appendChild(node);
  return node;
}

function EAH28_IMAGE_NODE(url, alt, className) {
  const img = document.createElement("img");
  img.src = EAH28_IMAGE(url);
  img.alt = alt || "";
  img.className = className || "";
  img.loading = "lazy";
  return img;
}

function EAH28_VIDEO(parent, url) {
  const videoUrl = EAH28_IMAGE(url);
  if (!videoUrl) return;

  if (
    /\.(mp4|webm|ogg)(\?|#|$)/i.test(videoUrl)
  ) {
    const video = document.createElement("video");
    video.src = videoUrl;
    video.controls = true;
    video.preload = "metadata";
    video.className = "eah28-media";
    parent.appendChild(video);
  } else {
    const link = document.createElement("a");
    link.href = videoUrl;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "Voir la vidéo";
    parent.appendChild(link);
  }
}


/* ============================================================
   FENETRE DETAILLEE
============================================================ */

function EAH28_MODAL(title, contentBuilder) {
  document.querySelector(".eah28-modal")?.remove();

  const overlay = document.createElement("div");
  overlay.className = "eah28-modal";

  const windowBox = document.createElement("div");
  windowBox.className = "eah28-window";
  windowBox.setAttribute("role", "dialog");
  windowBox.setAttribute("aria-modal", "true");
  windowBox.setAttribute("aria-label", title);

  const close = document.createElement("button");
  close.className = "eah28-close";
  close.textContent = "×";
  close.setAttribute("aria-label", "Fermer");

  close.onclick = () => overlay.remove();

  windowBox.appendChild(close);

  EAH28_APPEND_TEXT(windowBox, "h2", title);

  contentBuilder(windowBox);

  overlay.appendChild(windowBox);
  document.body.appendChild(overlay);

  overlay.addEventListener("click", event => {
    if (event.target === overlay) overlay.remove();
  });

  const escapeHandler = event => {
    if (event.key === "Escape") {
      overlay.remove();
      document.removeEventListener(
        "keydown",
        escapeHandler
      );
    }
  };

  document.addEventListener("keydown", escapeHandler);

  close.focus();
}


/* ============================================================
   GALERIE PHOTO
============================================================ */

function EAH28_GALLERY(parent, photos, title) {
  const urls = [...new Set(
    photos.map(EAH28_IMAGE).filter(Boolean)
  )];

  if (!urls.length) return;

  const main = EAH28_IMAGE_NODE(
    urls[0],
    title,
    "eah28-media"
  );

  main.loading = "eager";
  parent.appendChild(main);

  if (urls.length === 1) return;

  const gallery = document.createElement("div");
  gallery.className = "eah28-gallery";

  urls.forEach((url, index) => {
    const thumb = document.createElement("button");
    thumb.type = "button";
    thumb.setAttribute(
      "aria-label",
      "Afficher la photo " + (index + 1)
    );

    thumb.appendChild(
      EAH28_IMAGE_NODE(url, title)
    );

    thumb.onclick = () => {
      main.src = url;
    };

    gallery.appendChild(thumb);
  });

  parent.appendChild(gallery);
}

const EAH28_ORIGINAL_HEADER = renderHeader;

  EAH28_ORIGINAL_HEADER();

  const page = state.pages.find(
    p => String(p.slug).toLowerCase() ===
      String(state.currentPage).toLowerCase()
  );

  const hero = document.getElementById("hero");

  if (!hero) return;

  // La photo d'illustration ne sert jamais de couverture.

  const cover = EAH28_IMAGE(
    page?.settings?.cover_url ||

    hero.classList.add("eah28-coverless");
  }
};

EAH_RENDER_DISCIPLINES = function(page, section) {
  const disciplines =
    page.settings?.disciplines || [];

  if (!disciplines.length) {
    EAH28_APPEND_TEXT(
      section,
      "p",
      "Aucune discipline disponible."
    );
    return;

  disciplines.forEach(d => {

    const name = d.nom || d.name || "Discipline";
    const card = element("article", "card");

    const image = EAH28_IMAGE(
      d.image_url || d.photo_illustration_url
    );

    const open = () => {
      EAH28_MODAL(name, box => {
        EAH28_GALLERY(box, [image], name);

        EAH28_APPEND_TEXT(
          box,
          "p",
          d.description || d.description_longue,
          "eah28-description"
        );

        const tarifs = Array.isArray(d.tarifs)
          ? d.tarifs
          : [1, 2, 3].map(n => ({
              titre: "Tarif " + n,
              prix: d["tarif_" + n],
              description: d["description_tarif_" + n]
            }));

        tarifs.forEach(t => {
          if (!t.prix && !t.description) return;

          const line = element("div", "eah28-tarif");

          EAH28_APPEND_TEXT(
            line,
            "strong",
            t.titre || "Tarif"
          );

          EAH28_APPEND_TEXT(
            line,
            "p",
            t.prix ? String(t.prix) + " €" : ""
          );

          EAH28_APPEND_TEXT(
            line,
            "p",
            t.description
          );

          box.appendChild(line);
        });

        EAH28_VIDEO(box, d.video_url);
      });
    };

    if (image) {
      const img = EAH28_IMAGE_NODE(
        image,
        name,
        "eah28-card-image"
      );

      img.onclick = open;
      card.appendChild(img);
    }

    EAH28_APPEND_TEXT(card, "h3", name);

    card.appendChild(
      button("Découvrir", open, true)
    );

    grid.appendChild(card);
  });

  section.appendChild(grid);

renderBadges = function(section) {
  const page = state.pages.find(
    p => p.slug === "blazons"
  );

  const settings = page?.settings || {};

  const details =
    settings.blazons_v21 ||
    settings.blazons_details ||
    [];

  const grid = element("div", "cards");

  state.badges.forEach(badge => {
    const detail = details.find(
      b => String(b.id) === String(badge.badge_key)
    ) || {};

    const name = detail.name || badge.name;

    const image = EAH28_IMAGE(
      detail.image_url || badge.image_url
    );

    const card = element("article", "card");

    const open = () => {
      EAH28_MODAL(name, box => {
        EAH28_GALLERY(box, [image], name);

        EAH28_APPEND_TEXT(
          box,
          "p",
          detail.description,
          "eah28-description"
        );

        let criteria = detail.criteres || [];

        if (typeof criteria === "string") {
          criteria = criteria.split(/\r?\n/);
        }

        if (!criteria.length) {
          criteria = (
            settings.criteres_blazons || []
          )
            .filter(c =>
              String(c.blazon_id) ===
              String(badge.badge_key)
            )
            .map(c =>
              c.description +
              (c.valeur ? " : " + c.valeur : "")
            );
        }

        criteria.forEach(item => {
          EAH28_APPEND_TEXT(
            box,
            "p",
            "✓ " + item
          );
        });
      });
    };

    if (image) {
      const img = EAH28_IMAGE_NODE(
        image,
        name,
        "eah28-card-image"
      );
      img.onclick = open;
      card.appendChild(img);
    }

    EAH28_APPEND_TEXT(card, "h3", name);

    card.appendChild(
      button("Voir les critères", open, true)
    );

    grid.appendChild(card);
  });

  section.appendChild(grid);
};

renderBoutique = function(section) {
  const page = state.pages.find(
    p => p.slug === "boutique"

  const products = enriched.length
    ? enriched
    : state.products;

  const grid = element("div", "cards");

  const cartBox = element("div", "panel");
  cartBox.style.marginTop = "25px";

  products.forEach(product => {
    if (product.active === false) return;

    const name = product.name || "Produit";

    const photos = Array.isArray(product.images)
      ? product.images
      : [product.image_url];

    const card = element("article", "card");

    const open = () => {
      EAH28_MODAL(name, box => {
        EAH28_GALLERY(box, photos, name);

        EAH28_APPEND_TEXT(
          box,
          "p",
          product.description,
          "eah28-description"
        );

        EAH28_APPEND_TEXT(
          box,
          "p",
          money(product.price),
          "eah28-price"
        );

        EAH28_VIDEO(box, product.video_url);

        const sizes = Array.isArray(product.sizes)
          ? product.sizes
          : [];

        const select = document.createElement("select");
        select.className = "eah28-select";

        sizes.forEach(size => {
          const option = document.createElement("option");
          option.value = size;
          option.textContent = size;
          select.appendChild(option);
        });

        if (sizes.length) {
          EAH28_APPEND_TEXT(
            box,
            "p",
            "Choisir une taille :"
          );
          box.appendChild(select);
        }

        EAH28_APPEND_TEXT(
          box,
          "p",
          "Stock : " + product.stock
        );

        const add = button(
          "Ajouter au panier",
          () => {
            addToCart(
              product,
              sizes.length ? select.value : ""
            );

            renderCart(cartBox);

            document.querySelector(
              ".eah28-modal"
            )?.remove();
          },
          true
        );

        add.disabled = Number(product.stock) <= 0;
        box.appendChild(add);
      });
    };

    if (photos[0]) {
      const img = EAH28_IMAGE_NODE(
        photos[0],
        name,
        "eah28-card-image"
      );

      img.onclick = open;
      card.appendChild(img);
    }

    EAH28_APPEND_TEXT(card, "h3", name);

    EAH28_APPEND_TEXT(
      card,
      "p",
      money(product.price),
      "eah28-price"
    );

    card.appendChild(
      button("Voir le produit", open, true)
    );

    grid.appendChild(card);
  });

  section.appendChild(grid);
  section.appendChild(cartBox);

  renderCart(cartBox);
};

  }

  const settings = page.settings || {};

  // L'illustration ne reprend jamais la couverture.
  const illustration = EAH28_IMAGE(
    settings.illustration_url || ""
  );

  if (illustration) {
    const img = EAH28_IMAGE_NODE(
      illustration,
      page.title,
      "page-image"
    );

    section.appendChild(img);
  }

  const video = EAH28_IMAGE(
    settings.video_v21 || page.video_url
  );

  if (video) {
    EAH28_VIDEO(section, video);
  }

  if (page.slug === "disciplines") {
    EAH_RENDER_DISCIPLINES(page, section);
  }

  if (page.slug === "blazons") {
    renderBadges(section);
  }

  if (page.slug === "actualites") {
    EAH_RENDER_ACTUALITES(page, section);
  }

  if (
    !page.description &&
    !illustration &&
    !video &&
    ![
      "disciplines",
      "blazons",
      "actualites"
    ].includes(page.slug)
  ) {
    EAH28_APPEND_TEXT(
      section,
      "p",
      "Contenu bientôt disponible."
    );
  }
};

console.log("EAH V28 : fiches détaillées chargées.");

start();

})();
</script>
