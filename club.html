<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03131f">

<title>EAH Diving Club</title>

<style>
:root {
  --primary:#0b6bff;
  --secondary:#03131f;
  --text:#ffffff;
  --muted:#b8cadb;
}

* {
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body {
  margin:0;
  background:var(--secondary);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

button {
  font:inherit;
  cursor:pointer;
}

a {
  color:inherit;
}

#loading {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
}

.loading-title {
  color:#35caff;
  font-size:34px;
  font-weight:900;
  letter-spacing:3px;
}

.spinner {
  width:42px;
  height:42px;
  border:4px solid #ffffff30;
  border-top-color:#35caff;
  border-radius:50%;
  margin:25px auto;
  animation:spin .9s linear infinite;
}

@keyframes spin {
  to { transform:rotate(360deg); }
}

#app {
  display:none;
}

header {
  position:sticky;
  top:0;
  z-index:100;
  background:var(--secondary);
  border-bottom:1px solid #ffffff20;
  padding:16px 24px;
}

.header-inner {
  max-width:1400px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
  flex-wrap:wrap;
}

.brand {
  display:flex;
  align-items:center;
  gap:15px;
  font-size:20px;
  font-weight:900;
}

.brand img {
  width:60px;
  height:60px;
  object-fit:contain;
}

nav {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

nav button {
  padding:12px 17px;
  background:transparent;
  color:white;
  border:1px solid #ffffff30;
  border-radius:10px;
}

nav button.active,
nav button:hover {
  background:var(--primary);
  border-color:var(--primary);
}

.hero {
  position:relative;
  min-height:440px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:70px 25px;
  background-size:cover;
  background-position:center;
}

.hero::before {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    90deg,
    rgba(0,12,24,.85),
    rgba(0,12,24,.45)
  );
}

.hero-content {
  position:relative;
  z-index:1;
  max-width:950px;
}

.hero h1 {
  font-size:clamp(36px,6vw,76px);
  margin:0 0 20px;
  line-height:1.08;
}

.hero p {
  font-size:clamp(17px,2vw,24px);
  line-height:1.6;
  color:#e3edf5;
}

main {
  max-width:1250px;
  margin:auto;
  padding:45px 20px 80px;
}

.page {
  display:none;
}

.page.active {
  display:block;
}

.page h2 {
  font-size:clamp(28px,4vw,44px);
  margin-top:0;
}

.page-description {
  font-size:18px;
  color:var(--muted);
  line-height:1.8;
  white-space:pre-line;
}

.page-image {
  display:block;
  width:100%;
  max-height:580px;
  object-fit:cover;
  border-radius:18px;
  margin:25px 0;
}

.page-video {
  display:block;
  width:100%;
  max-width:900px;
  margin:25px auto;
  border-radius:16px;
}

.cards {
  display:grid;
  grid-template-columns:repeat(
    auto-fit,
    minmax(230px,1fr)
  );
  gap:22px;
  margin-top:30px;
}

.card {
  background:#ffffff0b;
  border:1px solid #ffffff25;
  border-radius:16px;
  overflow:hidden;
}

.card img {
  width:100%;
  height:210px;
  object-fit:contain;
  padding:15px;
}

.card h3 {
  padding:0 18px 20px;
  font-size:20px;
}

.empty {
  padding:25px;
  background:#ffffff0a;
  border:1px solid #ffffff20;
  border-radius:14px;
  color:var(--muted);
}

#error {
  display:none;
  max-width:700px;
  margin:60px auto;
  padding:30px;
  border:1px solid #ff7777;
  border-radius:15px;
  color:white;
}

#error button {
  padding:12px 20px;
  border:0;
  border-radius:9px;
  background:var(--primary);
  color:white;
}

footer {
  text-align:center;
  padding:35px 20px;
  border-top:1px solid #ffffff20;
  color:var(--muted);
}

@media(max-width:700px) {
  header {
    padding:12px;
  }

  .header-inner {
    justify-content:center;
  }

  nav {
    justify-content:center;
  }

  nav button {
    padding:10px 12px;
    font-size:14px;
  }

  .hero {
    min-height:330px;
  }

  main {
    padding-top:30px;
  }
}
</style>
</head>

<body>

<div id="loading">
  <div>
    <div class="loading-title">EAH DIVING</div>
    <div class="spinner"></div>
    <p>Chargement du club...</p>
  </div>
</div>

<div id="error">
  <h2>Impossible de charger le club</h2>
  <p id="error-message"></p>
  <button onclick="location.reload()">
    Réessayer
  </button>
</div>

<div id="app">

  <header>
    <div class="header-inner">

      <div class="brand">
        <img id="club-logo" alt="Logo du club" hidden>
        <span id="club-brand"></span>
      </div>

      <nav id="menu"></nav>

    </div>
  </header>

  <section class="hero" id="hero">
    <div class="hero-content">
      <h1 id="hero-title"></h1>
      <p id="hero-tagline"></p>
    </div>
  </section>

  <main id="pages"></main>

  <footer>
    <span id="footer-name"></span>
    <br><br>
    Propulsé par EAH Diving
  </footer>

</div>

<script>
(function () {
  "use strict";

  /* ==========================================
     EAH DIVING CLUB — SITE DYNAMIQUE V2

     Lecture publique Supabase.
     Aucune clé secrète dans ce fichier.
  ========================================== */

  const SUPABASE_URL =
    "https://limyeqpdzjjwsdximehp.supabase.co";

  const PUBLIC_KEY =
    "sb_publishable_K9iUm_0Qhea65P1Zt6rbXQ_BXQCzJ9w";

  const DEFAULT_CLUB =
    "eah-club-demo-1793054157740";

  const params =
    new URLSearchParams(location.search);

  const CLUB_SLUG =
    params.get("club") ||
    params.get("eah_club_preview") ||
    DEFAULT_CLUB;

  const $ = id =>
    document.getElementById(id);

  const state = {
    club:null,
    config:{},
    pages:[],
    badges:[]
  };

  function safeColor(value, fallback) {
    const color = String(value || "");

    return /^#[0-9a-f]{6}$/i.test(color)
      ? color
      : fallback;
  }

  function safeImage(value) {
    if (!value) return "";

    try {
      const url = new URL(
        String(value),
        location.href
      );

      if (
        url.protocol === "https:" ||
        url.protocol === "http:"
      ) {
        return url.href;
      }
    } catch (e) {}

    return "";
  }

  function text(id, value) {
    $(id).textContent = String(value || "");
  }

  async function query(table, filters) {
    const url =
      SUPABASE_URL +
      "/rest/v1/" +
      table +
      "?" +
      filters;

    const response = await fetch(url, {
      method:"GET",
      headers:{
        apikey:PUBLIC_KEY,
        Authorization:"Bearer " + PUBLIC_KEY,
        Accept:"application/json"
      },
      cache:"no-store"
    });

    if (!response.ok) {
      throw new Error(
        "Supabase HTTP " + response.status +
        " — table " + table
      );
    }

    return response.json();
  }

  async function loadClub() {
    const clubs = await query(
      "clubs",
      "select=*&slug=eq." +
      encodeURIComponent(CLUB_SLUG)
    );

    if (!clubs.length) {
      throw new Error(
        "Club introuvable : " + CLUB_SLUG
      );
    }

    state.club = clubs[0];

    const clubId =
      encodeURIComponent(state.club.id);

    const results = await Promise.all([
      query(
        "eah_club_site_config",
        "select=*&club_id=eq." + clubId
      ),

      query(
        "eah_club_pages",
        "select=*&club_id=eq." + clubId +
        "&active=eq.true" +
        "&order=sort_order.asc"
      ),

      query(
        "eah_club_badges",
        "select=*&club_id=eq." + clubId +
        "&active=eq.true" +
        "&order=sort_order.asc"
      )
    ]);

    state.config = results[0][0] || {};
    state.pages = results[1] || [];
    state.badges = results[2] || [];
  }

  function renderHeader() {
    const club = state.club;
    const config = state.config;

    const title =
      config.site_title ||
      club.name ||
      "EAH Diving Club";

    const primary = safeColor(
      config.primary_color ||
      club.primary_color,
      "#0b6bff"
    );

    const secondary = safeColor(
      config.secondary_color ||
      club.secondary_color,
      "#03131f"
    );

    document.documentElement.style.setProperty(
      "--primary",
      primary
    );

    document.documentElement.style.setProperty(
      "--secondary",
      secondary
    );

    document.title = title;

    text("club-brand", title);
    text("hero-title", title);
    text("footer-name", title);

    text(
      "hero-tagline",
      config.tagline ||
      club.welcome_text ||
      ""
    );

    const logo = safeImage(
      config.logo_url ||
      club.logo_url
    );

    if (logo) {
      $("club-logo").src = logo;
      $("club-logo").hidden = false;
    }

    const hero = safeImage(
      config.hero_url
    );

    if (hero) {
      $("hero").style.backgroundImage =
        'url("' + hero + '")';
    }
  }

  function createElement(tag, className, value) {
    const element =
      document.createElement(tag);

    if (className) {
      element.className = className;
    }

    if (value !== undefined) {
      element.textContent =
        String(value || "");
    }

    return element;
  }

  function renderBadges(container) {
    if (!state.badges.length) {
      container.appendChild(
        createElement(
          "div",
          "empty",
          "Aucun blazon disponible."
        )
      );
      return;
    }

    const grid =
      createElement("div", "cards");

    state.badges.forEach(badge => {
      const card =
        createElement("article", "card");

      const image = safeImage(
        badge.image_url
      );

      if (image) {
        const img =
          document.createElement("img");

        img.src = image;
        img.alt = badge.name || "Blazon";
        img.loading = "lazy";

        card.appendChild(img);
      }

      card.appendChild(
        createElement(
          "h3",
          "",
          badge.name || badge.badge_key
        )
      );

      grid.appendChild(card);
    });

    container.appendChild(grid);
  }

  function renderPageContent(page, section) {
    const description =
      String(page.description || "");

    if (description) {
      section.appendChild(
        createElement(
          "p",
          "page-description",
          description
        )
      );
    }

    const desktopImage =
      safeImage(page.image_url);

    const mobileImage =
      safeImage(page.mobile_image_url);

    if (desktopImage || mobileImage) {
      const picture =
        document.createElement("picture");

      if (mobileImage) {
        const source =
          document.createElement("source");

        source.media = "(max-width:700px)";
        source.srcset = mobileImage;
        picture.appendChild(source);
      }

      const image =
        document.createElement("img");

      image.className = "page-image";
      image.src = desktopImage || mobileImage;
      image.alt = page.title || "";
      image.loading = "lazy";

      picture.appendChild(image);
      section.appendChild(picture);
    }

    const videoUrl =
      safeImage(page.video_url);

    if (videoUrl) {
      const video =
        document.createElement("video");

      video.className = "page-video";
      video.src = videoUrl;
      video.controls = true;
      video.preload = "metadata";

      section.appendChild(video);
    }

    if (
      String(page.slug).toLowerCase() ===
      "blazons"
    ) {
      renderBadges(section);
    }

    if (
      !description &&
      !desktopImage &&
      !mobileImage &&
      !videoUrl &&
      String(page.slug).toLowerCase() !==
        "blazons"
    ) {
      section.appendChild(
        createElement(
          "div",
          "empty",
          "Le contenu de cette page sera bientôt disponible."
        )
      );
    }
  }

  function showPage(index) {
    document.querySelectorAll(
      ".page"
    ).forEach((page, i) => {
      page.classList.toggle(
        "active",
        i === index
      );
    });

    document.querySelectorAll(
      "#menu button"
    ).forEach((button, i) => {
      button.classList.toggle(
        "active",
        i === index
      );
    });

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });
  }

  function renderPages() {
    const menu = $("menu");
    const pages = $("pages");

    menu.replaceChildren();
    pages.replaceChildren();

    state.pages.forEach((page, index) => {
      const button =
        createElement(
          "button",
          "",
          page.title || page.slug
        );

      button.type = "button";

      button.addEventListener(
        "click",
        () => showPage(index)
      );

      menu.appendChild(button);

      const section =
        createElement("section", "page");

      const heading =
        createElement(
          "h2",
          "",
          page.title || page.slug
        );

      section.appendChild(heading);

      renderPageContent(
        page,
        section
      );

      pages.appendChild(section);
    });

    if (!state.pages.length) {
      pages.appendChild(
        createElement(
          "div",
          "empty",
          "Aucune page active pour ce club."
        )
      );
      return;
    }

    showPage(0);
  }

  async function start() {
    try {
      await loadClub();

      renderHeader();
      renderPages();

      $("loading").style.display = "none";
      $("app").style.display = "block";

    } catch (error) {
      console.error(
        "EAH Club :",
        error
      );

      $("loading").style.display = "none";
      $("error").style.display = "block";

      text(
        "error-message",
        error.message ||
        "Erreur inconnue"
      );
    }
  }

  start();

})();
</script>

</body>
</html>
