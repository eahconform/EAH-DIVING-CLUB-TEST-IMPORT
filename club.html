<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03131f">
<title>EAH Diving Club</title>

<style>
:root{
  --primary:#0b6bff;
  --secondary:#03131f;
  --text:#fff;
  --muted:#b8cadb;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--secondary);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
a{color:inherit}
[hidden]{display:none!important}
header{
  position:sticky;
  top:0;
  z-index:10;
  padding:16px 24px;
  background:var(--secondary);
  border-bottom:1px solid #ffffff25;
}
.header-inner{
  max-width:1400px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:20px;
  font-weight:800;
}
.brand img{width:54px;height:54px;object-fit:contain}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button,.secondary-button{
  padding:12px 16px;
  background:transparent;
  border:1px solid #ffffff35;
  color:white;
  border-radius:10px;
}
nav button.active,nav button:hover,.primary-button{
  background:var(--primary);
  border-color:var(--primary);
  color:white;
}
.primary-button{
  padding:12px 18px;
  border:0;
  border-radius:10px;
  font-weight:bold;
}
.hero{
  min-height:360px;
  padding:65px 25px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background-size:cover;
  background-position:center;
  position:relative;
}
.hero:before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,12,24,.58);
}
.hero-content{position:relative;max-width:1000px}
.hero h1{
  font-size:clamp(34px,6vw,75px);
  margin:0 0 20px;
}
.hero p{
  font-size:clamp(17px,2vw,24px);
  color:#e3edf5;
}
main{max-width:1250px;margin:auto;padding:40px 20px 80px}
.page{display:none}
.page.active{display:block}
.page h2{font-size:clamp(28px,4vw,43px)}
.page-description{
  color:var(--muted);
  line-height:1.7;
  white-space:pre-line;
}
.page-image{
  width:100%;
  max-height:560px;
  object-fit:cover;
  border-radius:15px;
  margin:20px 0;
}
.page-video{
  width:100%;
  max-width:900px;
  display:block;
  margin:20px auto;
}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
  margin-top:25px;
}
.card,.panel{
  background:#ffffff0b;
  border:1px solid #ffffff25;
  border-radius:15px;
  padding:20px;
}
.card img{
  width:100%;
  height:210px;
  object-fit:contain;
}
.card h3{margin:12px 0}
.muted{color:var(--muted)}
.price{font-size:23px;font-weight:bold}
.form{
  display:grid;
  gap:14px;
  max-width:560px;
}
input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ffffff40;
  border-radius:9px;
  color:white;
  background:#112b40;
}
input::placeholder{color:#aec0ce}
label{display:grid;gap:6px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.status{
  padding:13px;
  border-radius:9px;
  background:#ffffff12;
  margin:15px 0;
  white-space:pre-line;
}
.error{border:1px solid #ff6c6c;color:#ffd1d1}
.success{border:1px solid #45c98a}
.empty{
  padding:22px;
  color:var(--muted);
  border:1px solid #ffffff20;
  border-radius:12px;
}
.cart-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #ffffff25;
  padding:12px 0;
}
.cart-line button{padding:8px}
footer{
  text-align:center;
  padding:30px;
  border-top:1px solid #ffffff20;
  color:var(--muted);
}
#loading{
  min-height:100vh;
  display:grid;
  place-items:center;
  text-align:center;
  font-size:24px;
}
@media(max-width:700px){
  header{padding:12px}
  .header-inner{justify-content:center}
  nav{justify-content:center}
  nav button{padding:10px;font-size:14px}
  .hero{min-height:290px}
}
</style>
</head>

<body>

<div id="loading">
  <div>
    <h2>EAH DIVING</h2>
    <p>Chargement du club...</p>
  </div>
</div>

<div id="app" hidden>

<header>
  <div class="header-inner">
    <div class="brand">
      <img id="club-logo" alt="Logo" hidden>
      <span id="club-brand"></span>
    </div>
    <nav id="menu"></nav>
  </div>
</header>

<section class="hero" id="hero">
  <div class="hero-content">
    <h1 id="hero-title"></h1>
    <p id="hero-tagline"></p>
  </div>
</section>

<main id="pages"></main>

<footer>
  <span id="footer-name"></span>
  <p>Propulsé par EAH Diving</p>
</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
(function(){
"use strict";

/* =========================================
   EAH DIVING CLUB V3
   SITE PERSONNALISABLE MULTICLUB
   BOUTIQUE + AUTHENTIFICATION
========================================= */

const SUPABASE_URL =
  "https://limyeqpdzjjwsdximehp.supabase.co";

const PUBLIC_KEY =
  "sb_publishable_K9iUm_0Qhea65P1Zt6rbXQ_BXQCzJ9w";

const DEFAULT_CLUB =
  "eah-club-demo-1793054157740";

const params = new URLSearchParams(location.search);

const CLUB_SLUG =
  params.get("club") ||
  params.get("eah_club_preview") ||
  DEFAULT_CLUB;

const $ = id => document.getElementById(id);

const sb = window.supabase.createClient(
  SUPABASE_URL,
  PUBLIC_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

const state = {
  club:null,
  config:{},
  pages:[],
  badges:[],
  products:[],
  cart:[],
  user:null,
  member:null,
  currentPage:""
};

const MANAGER_ROLES = [
  "admin",
  "owner",
  "manager",
  "responsable"
];

function element(tag,className,text){
  const e=document.createElement(tag);
  if(className)e.className=className;
  if(text!==undefined)e.textContent=String(text??"");
  return e;
}

function safeImage(value) {

  if (!value) return "";

  const raw = String(value).trim();

  // Reconnaissance des liens Google Drive
  const match = raw.match(
    /(?:drive\.google\.com\/file\/d\/|drive\.google\.com\/open\?id=|drive\.google\.com\/uc\?(?:[^#]*&)?id=)([a-zA-Z0-9_-]{20,})/
  );

  if (match) {
    return (
      "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(match[1]) +
      "&sz=w1000"
    );
  }

  // Reconnaissance d'un identifiant Drive seul
  if (/^[a-zA-Z0-9_-]{20,}$/.test(raw)) {
    return (
      "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(raw) +
      "&sz=w1000"
    );
  }

  // URL classique
  try {
    const u = new URL(raw, location.href);

    if (["https:", "http:"].includes(u.protocol)) {
      return u.href;
    }

  } catch (e) {}

  return "";
}

function safeColor(value,fallback){
  return /^#[0-9a-f]{6}$/i.test(String(value||""))
    ? value
    : fallback;
}

function money(value){
  return Number(value||0).toLocaleString(
    "fr-FR",
    {style:"currency",currency:"EUR"}
  );
}

function message(container,text,isError=false){
  container.replaceChildren();
  const e=element(
    "div",
    "status "+(isError?"error":"success"),
    text
  );
  container.appendChild(e);
}

function button(label,handler,primary=false){
  const b=element(
    "button",
    primary?"primary-button":"secondary-button",
    label
  );
  b.type="button";
  b.addEventListener("click",handler);
  return b;
}

async function publicQuery(table,query){
  const response=await fetch(
    SUPABASE_URL+"/rest/v1/"+table+"?"+query,
    {
      headers:{
        apikey:PUBLIC_KEY,
        Authorization:"Bearer "+PUBLIC_KEY,
        Accept:"application/json"
      },
      cache:"no-store"
    }
  );
  if(!response.ok)
    throw new Error(
      table+" : HTTP "+response.status
    );
  return response.json();
}

async function loadClub(){
  const clubs=await publicQuery(
    "clubs",
    "select=*&slug=eq."+encodeURIComponent(CLUB_SLUG)
  );

  if(!clubs.length)
    throw new Error("Club introuvable : "+CLUB_SLUG);

  state.club=clubs[0];

  const id=encodeURIComponent(state.club.id);

  const results=await Promise.all([
    publicQuery(
      "eah_club_site_config",
      "select=*&club_id=eq."+id
    ),
    publicQuery(
      "eah_club_pages",
      "select=*&club_id=eq."+id+
      "&active=eq.true&order=sort_order.asc"
    ),
    publicQuery(
      "eah_club_badges",
      "select=*&club_id=eq."+id+
      "&active=eq.true&order=sort_order.asc"
    ),
    publicQuery(
      "eah_club_products",
      "select=*&club_id=eq."+id+
      "&active=eq.true&order=sort_order.asc"
    )
  ]);

  state.config=results[0][0]||{};
  state.pages=results[1]||[];
  state.badges=results[2]||[];
  state.products=results[3]||[];
}

function renderHeader(){
  const c=state.club;
  const cfg=state.config;

  const title=cfg.site_title||c.name||"EAH Diving Club";

  document.title=title;

  ["club-brand","hero-title","footer-name"]
    .forEach(id=>$(id).textContent=title);

  $("hero-tagline").textContent=
    cfg.tagline||c.welcome_text||"";

  document.documentElement.style.setProperty(
    "--primary",
    safeColor(cfg.primary_color||c.primary_color,"#0b6bff")
  );

  document.documentElement.style.setProperty(
    "--secondary",
    safeColor(cfg.secondary_color||c.secondary_color,"#03131f")
  );

  const logo=safeImage(cfg.logo_url||c.logo_url);
  if(logo){
    $("club-logo").src=logo;
    $("club-logo").hidden=false;
  }

  const hero=safeImage(cfg.hero_url);
  if(hero){
    $("hero").style.backgroundImage=
      "url("+JSON.stringify(hero)+")";
  }
}

function renderBadges(section){
  if(!state.badges.length){
    section.appendChild(
      element("p","empty","Aucun blazon disponible.")
    );
    return;
  }

  const grid=element("div","cards");

  state.badges.forEach(badge=>{
    const card=element("article","card");
    const url=safeImage(badge.image_url);

    if(url){
      const img=element("img");
      img.src=url;
      img.alt=badge.name||"Blazon";
      img.loading="lazy";
      card.appendChild(img);
    }

    card.appendChild(
      element("h3","",badge.name||badge.badge_key)
    );

    grid.appendChild(card);
  });

  section.appendChild(grid);
}

function renderStandardPage(page,section){
  if(page.description){
    section.appendChild(
      element("p","page-description",page.description)
    );
  }

  const desktop=safeImage(page.image_url);
  const mobile=safeImage(page.mobile_image_url);

  if(desktop||mobile){
    const picture=element("picture");

    if(mobile){
      const source=element("source");
      source.media="(max-width:700px)";
      source.srcset=mobile;
      picture.appendChild(source);
    }

    const img=element("img","page-image");
    img.src=desktop||mobile;
    img.alt=page.title||"";
    picture.appendChild(img);

    section.appendChild(picture);
  }

  const video=safeImage(page.video_url);

  if(video){
    const v=element("video","page-video");
    v.src=video;
    v.controls=true;
    v.preload="metadata";
    section.appendChild(v);
  }

  if(page.slug==="blazons")
    renderBadges(section);

  if(
    !page.description &&
    !desktop &&
    !mobile &&
    !video &&
    page.slug!=="blazons"
  ){
    section.appendChild(
      element("p","empty","Contenu bientôt disponible.")
    );
  }
}

/* =========================================
   BOUTIQUE MULTICLUB
========================================= */

function renderBoutique(section){
  const container=element("div");
  section.appendChild(container);

  const intro=element(
    "p",
    "muted",
    "Découvrez les articles proposés par votre club."
  );
  container.appendChild(intro);

  if(!state.products.length){
    container.appendChild(
      element("div","empty","Aucun article disponible.")
    );
  }else{
    const grid=element("div","cards");

    state.products.forEach(product=>{
      const card=element("article","card");

      const url=safeImage(product.image_url);
      if(url){
        const img=element("img");
        img.src=url;
        img.alt=product.name;
        img.loading="lazy";
        card.appendChild(img);
      }

      card.appendChild(
        element("h3","",product.name)
      );

      if(product.description){
        card.appendChild(
          element("p","muted",product.description)
        );
      }

      card.appendChild(
        element("p","price",money(product.price))
      );

      card.appendChild(
        element(
          "p",
          "muted",
          "Stock : "+product.stock
        )
      );

      const sizes=Array.isArray(product.sizes)
        ? product.sizes
        : [];

      const select=element("select");

      if(sizes.length){
        sizes.forEach(size=>{
          const option=element("option","",size);
          option.value=String(size);
          select.appendChild(option);
        });
        card.appendChild(select);
      }

      const add=button(
        "Ajouter au panier",
        ()=>{
          const size=sizes.length?select.value:"";
          addToCart(product,size);
          renderCart(cartBox);
        },
        true
      );

      add.disabled=Number(product.stock)<=0;

      card.appendChild(add);
      grid.appendChild(card);
    });

    container.appendChild(grid);
  }

  const cartBox=element("div","panel");
  cartBox.style.marginTop="30px";
  container.appendChild(cartBox);

  renderCart(cartBox);
}

function addToCart(product,size){
  const existing=state.cart.find(
    x=>x.id===product.id&&x.size===size
  );

  const already=state.cart
    .filter(x=>x.id===product.id)
    .reduce((sum,x)=>sum+x.quantity,0);

  if(already>=Number(product.stock)){
    alert("Stock disponible atteint.");
    return;
  }

  if(existing){
    existing.quantity++;
  }else{
    state.cart.push({
      id:product.id,
      name:product.name,
      price:Number(product.price),
      size,
      quantity:1
    });
  }
}

function renderCart(container){
  container.replaceChildren();
  container.appendChild(element("h3","","Mon panier"));

  if(!state.cart.length){
    container.appendChild(
      element("p","muted","Votre panier est vide.")
    );
    return;
  }

  state.cart.forEach((item,index)=>{
    const line=element("div","cart-line");

    line.appendChild(
      element(
        "span",
        "",
        item.name+
        (item.size?" — "+item.size:"")+
        " × "+item.quantity+
        " : "+money(item.price*item.quantity)
      )
    );

    line.appendChild(
      button("Retirer",()=>{
        state.cart.splice(index,1);
        renderCart(container);
      })
    );

    container.appendChild(line);
  });

  const total=state.cart.reduce(
    (sum,item)=>sum+item.price*item.quantity,
    0
  );

  container.appendChild(
    element("h3","","Total indicatif : "+money(total))
  );

  container.appendChild(
    element(
      "p",
      "muted",
      "La prise de commande sera activée après installation "+
      "du contrôle serveur des prix et des stocks."
    )
  );
}

/* =========================================
   AUTHENTIFICATION ESPACE CLUB
========================================= */

async function refreshMember(){
  const result=await sb.auth.getUser();

  if(result.error){
    state.user=null;
    state.member=null;
    return;
  }

  state.user=result.data.user||null;
  state.member=null;

  if(!state.user)return;

  const response=await sb
    .from("club_members")
    .select("id,club_id,user_id,display_name,email,role,active")
    .eq("club_id",state.club.id)
    .eq("user_id",state.user.id)
    .eq("active",true)
    .maybeSingle();

  if(response.error){
    console.warn("Vérification club :",response.error.message);
    return;
  }

  state.member=response.data||null;
}

function isManager(){
  return Boolean(
    state.member &&
    MANAGER_ROLES.includes(
      String(state.member.role||"").toLowerCase()
    )
  );
}

function renderEspaceClub(section){
  const box=element("div","panel");
  section.appendChild(box);

  if(!state.user){
    box.appendChild(
      element(
        "p",
        "muted",
        "Connectez-vous avec vos identifiants EAH Diving."
      )
    );

    const form=element("form","form");

    const email=element("input");
    email.type="email";
    email.placeholder="Adresse e-mail";
    email.required=true;
    email.autocomplete="email";

    const password=element("input");
    password.type="password";
    password.placeholder="Mot de passe";
    password.required=true;
    password.autocomplete="current-password";

    const submit=element("button","primary-button","Se connecter");
    submit.type="submit";

    const feedback=element("div");

    form.append(email,password,submit,feedback);

    form.addEventListener("submit",async event=>{
      event.preventDefault();
      submit.disabled=true;

      const result=await sb.auth.signInWithPassword({
        email:email.value.trim(),
        password:password.value
      });

      submit.disabled=false;

      if(result.error){
        message(
          feedback,
          "Connexion impossible : "+result.error.message,
          true
        );
        return;
      }

      await refreshMember();
      renderPages("espace-club");
    });

    box.appendChild(form);
    return;
  }

  if(!state.member){
    box.appendChild(
      element(
        "p",
        "status error",
        "Votre compte est connecté, mais aucun accès actif "+
        "à ce club n'a été confirmé."
      )
    );

    box.appendChild(
      button("Se déconnecter",async()=>{
        await sb.auth.signOut();
        await refreshMember();
        renderPages("espace-club");
      })
    );
    return;
  }

  box.appendChild(
    element(
      "h3",
      "",
      "Bienvenue "+(
        state.member.display_name||
        state.user.email||
        "dans votre espace"
      )
    )
  );

  box.appendChild(
    element(
      "p",
      "muted",
      "Club : "+state.club.name+
      " — Rôle : "+state.member.role
    )
  );

  const actions=element("div","actions");

  actions.appendChild(
    button("Se déconnecter",async()=>{
      await sb.auth.signOut();
      await refreshMember();
      renderPages("espace-club");
    })
  );

  box.appendChild(actions);

  if(isManager()){
    renderManager(section);
  }else{
    section.appendChild(
      element(
        "div",
        "panel",
        "Votre compte club est reconnu. "+
        "Les fonctions réservées aux responsables "+
        "ne sont pas accessibles avec ce rôle."
      )
    );
  }
}

/* =========================================
   TABLEAU DE BORD RESPONSABLE
========================================= */

function renderManager(section){
  const panel=element("div","panel");
  panel.style.marginTop="20px";

  panel.appendChild(
    element("h3","","Administration du club")
  );

  panel.appendChild(
    element(
      "p",
      "muted",
      "Consultation des articles et des commandes. "+
      "Les modifications seront activées après "+
      "validation des autorisations."
    )
  );

  const products=element("div");

  products.appendChild(
    element(
      "h4",
      "",
      "Articles publics : "+state.products.length
    )
  );

  state.products.forEach(p=>{
    products.appendChild(
      element(
        "p",
        "",
        p.name+" — "+money(p.price)+
        " — Stock : "+p.stock
      )
    );
  });

  panel.appendChild(products);

  const orders=element("div");
  orders.appendChild(
    element("h4","","Dernières commandes")
  );

  panel.appendChild(orders);
  section.appendChild(panel);

  loadManagerOrders(orders);
}

async function loadManagerOrders(container){
  const result=await sb
    .from("eah_club_orders")
    .select(
      "id,customer_name,total,status,payment_status,created_at"
    )
    .eq("club_id",state.club.id)
    .order("created_at",{ascending:false})
    .limit(20);

  if(result.error){
    container.appendChild(
      element(
        "p",
        "status error",
        "Commandes indisponibles : "+result.error.message
      )
    );
    return;
  }

  if(!result.data.length){
    container.appendChild(
      element("p","muted","Aucune commande.")
    );
    return;
  }

  result.data.forEach(order=>{
    container.appendChild(
      element(
        "p",
        "",
        new Date(order.created_at).toLocaleDateString("fr-FR")+
        " — "+order.customer_name+
        " — "+money(order.total)+
        " — "+order.status+
        " — Paiement : "+order.payment_status
      )
    );
  });
}

/* =========================================
   MENU DYNAMIQUE
========================================= */

function showPage(slug){
  state.currentPage=slug;

  document.querySelectorAll(".page").forEach(page=>{
    page.classList.toggle(
      "active",
      page.dataset.slug===slug
    );
  });

  document.querySelectorAll("#menu button").forEach(b=>{
    b.classList.toggle(
      "active",
      b.dataset.slug===slug
    );
  });

  window.scrollTo({top:0,behavior:"smooth"});
}

function renderPages(preferredSlug){
  const menu=$("menu");
  const pages=$("pages");

  menu.replaceChildren();
  pages.replaceChildren();

  state.pages.forEach(page=>{
    const slug=String(page.slug||"").toLowerCase();

    const nav=button(
      page.title||slug,
      ()=>showPage(slug)
    );

    nav.dataset.slug=slug;
    menu.appendChild(nav);

    const section=element("section","page");
    section.dataset.slug=slug;

    section.appendChild(
      element("h2","",page.title||slug)
    );

    if(slug==="boutique"){
      renderBoutique(section);
    }else if(slug==="espace-club"){
      renderEspaceClub(section);
    }else{
      renderStandardPage(page,section);
    }

    pages.appendChild(section);
  });

  if(!state.pages.length){
    pages.appendChild(
      element("div","empty","Aucune page active.")
    );
    return;
  }

  const requested=preferredSlug||state.currentPage;

  const exists=state.pages.some(
    p=>String(p.slug).toLowerCase()===requested
  );

  showPage(
    exists
      ? requested
      : String(state.pages[0].slug).toLowerCase()
  );
}

/* =========================================
   DEMARRAGE
========================================= */

async function start(){
  try{
    await loadClub();
    await refreshMember();

    renderHeader();
    renderPages();

    $("loading").hidden=true;
    $("app").hidden=false;

  }catch(error){
    console.error("EAH CLUB V3 :",error);

    $("loading").replaceChildren(
      element(
        "div",
        "status error",
        "Impossible de charger le club.\n"+
        (error.message||"Erreur inconnue")
      )
    );
  }
}

start();

})();
</script>
