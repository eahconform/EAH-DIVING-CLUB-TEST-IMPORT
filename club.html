<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>EAH Diving Club</title>
<style>
:root{
 --primary:#0b6bff;--secondary:#03131f;
 --text:#fff;--muted:#b8cadb;--card:#102b42;
 --radius:14px;--overlay:.58;--font:Arial,sans-serif
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--secondary);color:var(--text);font-family:var(--font)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
a{color:inherit}
header{position:sticky;top:0;z-index:20;padding:14px 20px;background:var(--secondary);border-bottom:1px solid #ffffff30}
.header-inner{max-width:1300px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800}
.brand img{width:52px;height:52px;object-fit:contain}
nav,.actions{display:flex;flex-wrap:wrap;gap:8px}
button,.primary-button{padding:11px 15px;border:1px solid #ffffff50;border-radius:10px;background:transparent;color:inherit;text-decoration:none}
button.active,.primary-button{background:var(--primary);border-color:var(--primary);color:#fff}
.hero{position:relative;min-height:320px;padding:45px 20px;display:flex;align-items:center;justify-content:center;text-align:center;background-position:center;background-size:cover}
.hero:before{content:"";position:absolute;inset:0;background:rgba(0,12,24,var(--overlay))}
.hero-content{position:relative;max-width:1000px}
.hero h1{margin:0;color:#fff;font-size:clamp(30px,5vw,56px);overflow-wrap:anywhere;text-shadow:0 3px 15px #000}
.hero p{font-size:20px;color:#fff;text-shadow:0 2px 10px #000}
main{max-width:1250px;min-height:250px;margin:auto;padding:35px 20px 80px}
.page{display:none}.page.active{display:block}
.page h2{font-size:clamp(26px,4vw,40px)}
.description{white-space:pre-wrap;line-height:1.7}
.muted{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),280px));gap:18px;margin-top:22px}
.card,.panel{background:var(--card);border:1px solid #ffffff30;border-radius:var(--radius);padding:17px;min-width:0}
.card{display:flex;flex-direction:column;gap:10px}
.card img{width:100%;aspect-ratio:1/1;object-fit:contain}
.card h3{margin:4px 0}
.price{font-size:22px;font-weight:bold}
.page-image{width:100%;max-height:560px;object-fit:contain;border-radius:12px;margin:20px 0}
.page-video{display:block;width:100%;max-width:850px;margin:15px auto}
.form{display:grid;gap:14px;max-width:550px}
label{display:grid;gap:6px}
input,select,textarea{width:100%;padding:12px;border-radius:9px;border:1px solid #ffffff50;background:#112b40;color:#fff}
.status{padding:14px;margin:15px 0;border-radius:10px;background:#ffffff15;white-space:pre-wrap}
.error{border:1px solid #ff7777;color:#ffd5d5}
.success{border:1px solid #50d69b}
.empty{padding:20px;border:1px solid #ffffff30;border-radius:10px;color:var(--muted)}
.cart-line{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #ffffff30;padding:10px 0}
footer{text-align:center;padding:28px;border-top:1px solid #ffffff20;color:var(--muted)}
#loading{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}
.modal{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:15px;background:#000d}
.modal-window{width:min(100%,920px);max-height:92vh;overflow:auto;padding:22px;border-radius:16px;border:1px solid #ffffff45;background:var(--card)}
.modal-close{float:right}
.modal-media{display:block;width:100%;max-height:60vh;object-fit:contain;margin:14px 0}
.gallery{display:flex;flex-wrap:wrap;gap:8px}
.gallery button{width:80px;height:70px;padding:3px}
.gallery img{width:100%;height:100%;object-fit:contain}
.detail-line{border-bottom:1px solid #ffffff25;padding:10px 0}
.nfc-photo{display:block;width:180px;height:180px;object-fit:cover;border-radius:50%;margin:20px auto}
.nfc-id{font-size:23px;font-weight:800;color:#70c8ff;overflow-wrap:anywhere}
.nfc-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.nfc-actions button{flex:1;min-width:150px}
.nfc-divider{border:0;border-top:1px solid #ffffff30;margin:25px 0}
details summary{cursor:pointer;padding:12px 0;font-weight:bold}
@media(max-width:650px){
 header{padding:10px}
 .header-inner,nav{justify-content:center}
 nav button{font-size:13px;padding:9px}
 .hero{min-height:260px}
 .cards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
 .card{padding:12px}
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
(function(){
"use strict";

/* ==========================================
   CONFIGURATION EAH DIVING
========================================== */

const SUPABASE_URL =
 "https://limyeqpdzjjwsdximehp.supabase.co";

const PUBLIC_KEY =
 "sb_publishable_K9iUm_0Qhea65P1Zt6rbXQ_BXQCzJ9w";

const DEFAULT_CLUB =
 "eah-club-demo-1793054157740";

const params=new URLSearchParams(location.search);

const CLUB_SLUG=
 params.get("club")||
 params.get("eah_club_preview")||
 DEFAULT_CLUB;

const NFC_TOKEN=params.get("nfc");

const $=id=>document.getElementById(id);

const state={
 club:null,config:{},pages:[],badges:[],
 products:[],cart:[],user:null,member:null,
 currentPage:"",sb:null
};

const MANAGER_ROLES=[
 "admin","owner","manager","responsable"
];

/* ==========================================
   OUTILS
========================================== */

function el(tag,cls="",value){
 const e=document.createElement(tag);
 if(cls)e.className=cls;
 if(value!==undefined)e.textContent=String(value??"");
 return e;
}

function button(label,handler,primary=false){
 const b=el("button",primary?"primary-button":"",label);
 b.type="button";
 b.addEventListener("click",handler);
 return b;
}

function message(parent,text,error=false){
 parent.replaceChildren(
  el("div","status "+(error?"error":"success"),text)
 );
}

function money(value){
 return Number(value||0).toLocaleString(
  "fr-FR",{style:"currency",currency:"EUR"}
 );
}

function array(v){return Array.isArray(v)?v:[]}

function object(v){
 return v&&typeof v==="object"&&!Array.isArray(v)?v:{};
}

function description(parent,text){
 if(text)parent.appendChild(el("p","description",text));
}

function safeImage(value){
 if(!value)return "";
 const raw=String(value).trim();
 let m=raw.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
 if(!m)m=raw.match(/[?&]id=([\w-]{20,})/);
 if(!m&&/^[\w-]{20,}$/.test(raw))m=[raw,raw];
 if(m)return "https://drive.google.com/thumbnail?id="+
  encodeURIComponent(m[1])+"&sz=w1000";
 try{
  const u=new URL(raw,location.href);
  if(["https:","http:"].includes(u.protocol))return u.href;
 }catch(e){}
 return "";
}

function image(parent,url,alt,cls=""){
 const src=safeImage(url);
 if(!src)return null;
 const img=el("img",cls);
 img.src=src;img.alt=alt||"";img.loading="lazy";
 img.onerror=()=>img.hidden=true;
 parent.appendChild(img);
 return img;
}

function video(parent,url){
 const src=safeImage(url);
 if(!src)return;
 if(/\.(mp4|webm|ogg)([?#]|$)/i.test(src)){
  const v=el("video","page-video");
  v.src=src;v.controls=true;v.preload="metadata";
  parent.appendChild(v);
 }else{
  const a=el("a","","Voir la vidéo");
  a.href=src;a.target="_blank";a.rel="noopener noreferrer";
  parent.appendChild(a);
 }
}

function safeColor(value,fallback){
 const colors={
  "bleu":"#0b6bff","bleu marine":"#102040",
  "bleu clair":"#70c8ff","orange":"#ff9800",
  "vert":"#23a455","rouge":"#e53935",
  "blanc":"#ffffff","noir":"#000000",
  "gris":"#808080","jaune":"#ffd600",
  "rose":"#ff69b4","violet":"#9333ea"
 };
 const t=String(value||"").trim();
 return colors[t.toLowerCase()]||
  (/^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(t)?t:fallback);
}

function numeric(value,fallback,min,max){
 const n=Number(value);
 return value!==""&&value!=null&&
  Number.isFinite(n)&&n>=min&&n<=max?n:fallback;
}

function field(parent,title,type,required=true){
 const label=el("label","",title);
 const input=el("input");
 input.type=type;input.required=required;
 label.appendChild(input);parent.appendChild(label);
 return input;
}

/* ==========================================
   CHARGEMENT PUBLIC SUPABASE
========================================== */

async function publicQuery(table,extra=""){
 const url=SUPABASE_URL+"/rest/v1/"+
  encodeURIComponent(table)+"?select=*"+extra;

 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),12000);

 try{
  const response=await fetch(url,{
   headers:{
    apikey:PUBLIC_KEY,
    Authorization:"Bearer "+PUBLIC_KEY,
    Accept:"application/json"
   },
   signal:controller.signal,
   cache:"no-store"
  });

  if(!response.ok){
   const body=await response.text();
   throw new Error(
    table+" : HTTP "+response.status+" "+body.slice(0,150)
   );
  }
  return await response.json();
 }finally{
  clearTimeout(timeout);
 }
}

async function loadClub(){
 const clubs=await publicQuery(
  "clubs","&slug=eq."+encodeURIComponent(CLUB_SLUG)+"&limit=1"
 );

 if(!clubs.length)throw new Error(
  "Club introuvable : "+CLUB_SLUG
 );

 const club=clubs[0],id=encodeURIComponent(club.id);

 const requests=[
  ["config","eah_club_site_config","&club_id=eq."+id],
  ["pages","eah_club_pages","&club_id=eq."+id+
   "&active=eq.true&order=sort_order.asc"],
  ["badges","eah_club_badges","&club_id=eq."+id+
   "&active=eq.true&order=sort_order.asc"],
  ["products","eah_club_products","&club_id=eq."+id+
   "&active=eq.true&order=sort_order.asc"]
 ];

 const results=await Promise.allSettled(
  requests.map(r=>publicQuery(r[1],r[2]))
 );

 const data={};
 results.forEach((r,i)=>{
  const key=requests[i][0];
  data[key]=r.status==="fulfilled"?r.value:[];
  if(r.status!=="fulfilled")
   console.warn("Chargement "+key,r.reason);
 });

 state.club=club;
 state.config=data.config[0]||{};
 state.pages=data.pages;
 state.badges=data.badges;
 state.products=data.products;

 if(!state.pages.length){
  state.pages=[{
   slug:"accueil",title:"Accueil",
   description:club.welcome_text||
    "Bienvenue sur le site de votre club.",
   settings:{}
  }];
 }
}

/* ==========================================
   PERSONNALISATION
========================================== */

function applyTheme(){
 const cfg=state.config,s=object(cfg.settings);
 const c=state.club||{};

 const themes={
  1:["#1478ff","#071725","#10243a","#e8f2ff","#ffffff","#15324c"],
  2:["#c7a466","#101010","#171717","#ede5d7","#f1d394","#24211c"],
  3:["#087e8b","#f3f6f8","#ffffff","#263746","#183044","#ffffff"],
  4:["#a855f7","#140d1f","#21152f","#f5efff","#ffffff","#302041"],
  5:["#7bc99c","#0d211e","#102c28","#e6f5e9","#ffffff","#193b34"]
 };

 const theme=themes[Number(s.STYLE_NUMERO)]||themes[1];
 const root=document.documentElement;

 const vars={
  "--primary":safeColor(
   s.PRIMARY_COLOR||cfg.primary_color||c.primary_color,theme[0]
  ),
  "--secondary":safeColor(
   s.BACKGROUND_COLOR||cfg.secondary_color,theme[1]
  ),
  "--text":safeColor(s.TEXT_COLOR,theme[3]),
  "--card":safeColor(s.CARD_COLOR,theme[5]),
  "--radius":numeric(s.CARD_RADIUS,14,0,40)+"px",
  "--overlay":numeric(s.HERO_OVERLAY,.58,0,1)
 };

 Object.entries(vars).forEach(([k,v])=>
  root.style.setProperty(k,v)
 );

 const fonts={
  Arial:"Arial,sans-serif",
  Roboto:"Roboto,Arial,sans-serif",
  Verdana:"Verdana,sans-serif",
  Georgia:"Georgia,serif",
  Tahoma:"Tahoma,sans-serif",
  "Times New Roman":"Times New Roman,serif"
 };

 root.style.setProperty(
  "--font",
  fonts[s.FONT_FAMILY||s.TEXT_FONT]||"Arial,sans-serif"
 );

 document.body.style.fontSize=
  numeric(s.TEXT_SIZE,16,10,32)+"px";

 const header=document.querySelector("header");
 if(header)header.style.backgroundColor=
  safeColor(s.HEADER_COLOR,theme[2]);

 const background=safeImage(s.BACKGROUND_IMAGE_URL);
 document.body.style.backgroundImage=
  background?`url("${background}")`:"none";
 document.body.style.backgroundSize="cover";
 document.body.style.backgroundAttachment="fixed";

 let style=$("eah-dynamic-style");
 if(!style){
  style=el("style");
  style.id="eah-dynamic-style";
  document.head.appendChild(style);
 }

 const titleColor=safeColor(s.TITLE_COLOR,theme[4]);
 const titleSize=numeric(s.TITLE_SIZE,38,18,72);
 const heroSize=numeric(
  s.HERO_TITLE_SIZE||s.COVER_TEXT_SIZE,52,24,100
 );
 const cardSize=numeric(s.CARD_TITLE_SIZE,23,12,42);

 style.textContent=`
 .page h2{color:${titleColor};font-size:${titleSize}px}
 .card h3{color:${titleColor};font-size:${cardSize}px}
 .hero h1{font-size:clamp(30px,5vw,${heroSize}px)}
 `;
}

function renderHeader(){
 if(!state.club)return;

 const cfg=state.config,c=state.club;
 const s=object(cfg.settings);

 applyTheme();

 const title=cfg.site_title||c.name||"EAH Diving Club";
 document.title=title;
 $("club-brand").textContent=title;
 $("footer-name").textContent=title;
 $("footer-text").textContent=

 const logo=safeImage(cfg.logo_url||c.logo_url);
 const logoEl=$("club-logo");
 logoEl.hidden=!logo;
 if(logo)logoEl.src=logo;
 logoEl.onerror=()=>logoEl.hidden=true;

 const heroTitle=String(s.HERO_TITLE||"").trim();
 $("hero-title").textContent=heroTitle;
 $("hero-title").hidden=!heroTitle;
 $("hero-tagline").textContent=

 const page=state.pages.find(
  p=>String(p.slug).toLowerCase()===state.currentPage

 const ps=object(page?.settings);
 const cover=safeImage(

 $("hero").style.backgroundImage=

 $("hero").style.minHeight=

/* ==========================================
   MODALES
========================================== */

function openModal(title,builder){
 document.querySelector(".modal")?.remove();

 const overlay=el("div","modal");
 const box=el("div","modal-window");

 box.setAttribute("role","dialog");
 box.setAttribute("aria-modal","true");

 const close=button("✕",()=>overlay.remove());
 close.className="modal-close";

 box.appendChild(close);
 box.appendChild(el("h2","",title));
 builder(box);
 overlay.appendChild(box);
 document.body.appendChild(overlay);

 overlay.addEventListener("click",e=>{
  if(e.target===overlay)overlay.remove();
 });

 const esc=e=>{
  if(e.key==="Escape"){
   overlay.remove();
   document.removeEventListener("keydown",esc);
  }
 };
 document.addEventListener("keydown",esc);
 close.focus();
}

function gallery(parent,photos,title){
 const urls=[...new Set(
  array(photos).map(safeImage).filter(Boolean)
 )];
 if(!urls.length)return;

 const main=image(parent,urls[0],title,"modal-media");
 if(urls.length<2)return;

 const thumbs=el("div","gallery");
 urls.forEach((url,index)=>{
  const b=button("Photo "+(index+1),()=>main.src=url);
  b.textContent="";
  image(b,url,"Photo "+(index+1));
  thumbs.appendChild(b);
 });
 parent.appendChild(thumbs);
}

/* ==========================================
   DISCIPLINES
========================================== */

function renderDisciplines(page,section){
 const disciplines=array(
  object(page.settings).disciplines
 );

 if(!disciplines.length){
  section.appendChild(
   el("p","empty","Aucune discipline disponible.")
  );
  return;
 }

 const grid=el("div","cards");

 disciplines.forEach(d=>{
  if(d.active===false)return;

  const name=d.nom||d.name||"Discipline";
  const picture=
   d.image_url||d.photo_illustration_url||d.photo_url;

  const card=el("article","card");

  const open=()=>openModal(name,box=>{
   gallery(box,[picture],name);
   description(box,d.description_longue||d.description);

   const tarifs=array(d.tarifs).length
    ?d.tarifs
    :[1,2,3].map(n=>({
      titre:"Tarif "+n,
      prix:d["tarif_"+n],
      description:d["description_tarif_"+n]
     }));

   tarifs.forEach(t=>{
    if(!t.prix&&!t.description)return;
    const line=el("div","detail-line");
    line.appendChild(el("h3","",t.titre||"Tarif"));
    if(t.prix)line.appendChild(
     el("p","price",String(t.prix)+" €")
    );
    description(line,t.description);
    box.appendChild(line);
   });

   if(d.tarif||d.prix)box.appendChild(
    el("p","price","Tarif : "+(d.tarif||d.prix))
   );

   video(box,d.video_url);
  });

  const img=image(card,picture,name);
  if(img){
   img.style.cursor="pointer";
   img.addEventListener("click",open);
  }

  card.appendChild(el("h3","",name));
  if(d.description)card.appendChild(
   el("p","muted",d.description)
  );
  card.appendChild(button("Découvrir",open,true));
  grid.appendChild(card);
 });

 section.appendChild(grid);
}

/* ==========================================
   BLAZONS
========================================== */

function renderBadges(page,section){
 const s=object(page.settings);
 const details=array(s.blazons_v21||s.blazons_details);
 const criteres=array(s.criteres_blazons);

 if(!state.badges.length){
  section.appendChild(
   el("p","empty","Aucun blazon disponible.")
  );
  return;
 }

 const grid=el("div","cards");

 state.badges.forEach(badge=>{
  const detail=details.find(
   x=>String(x.id)===String(badge.badge_key)
  )||{};

  const name=detail.name||badge.name||"Blazon";
  const picture=detail.image_url||badge.image_url;
  const card=el("article","card");

  const open=()=>openModal(name,box=>{
   gallery(box,[picture],name);
   description(box,detail.description);

   let items=detail.criteres||[];
   if(typeof items==="string")items=items.split(/\r?\n/);

   if(!array(items).length){
    items=criteres.filter(
     x=>String(x.blazon_id)===
      String(badge.badge_key)&&x.active!==false
    );
   }

   array(items).forEach(item=>{
    const text=typeof item==="string"
     ?item
     :(item.description||"")+
      (item.valeur?" : "+item.valeur:"");
    box.appendChild(el("p","","✓ "+text));
   });
  });

  const img=image(card,picture,name);
  if(img){
   img.style.cursor="pointer";
   img.addEventListener("click",open);
  }

  card.appendChild(el("h3","",name));
  card.appendChild(
   button("Voir les critères",open,true)
  );
  grid.appendChild(card);
 });

 section.appendChild(grid);
}

/* ==========================================
   ACTUALITES
========================================== */

function renderActualites(page,section){
 const s=object(page.settings);
 const articles=array(
  s.items_v21||s.actualites||s.articles
 );

 if(!articles.length){
  section.appendChild(
   el("p","empty","Aucune actualité disponible.")
  );
  return;
 }

 const grid=el("div","cards");

 articles.forEach(article=>{
  if(article.active===false)return;

  const title=
   article.titre||article.title||
   article.nom||"Actualité";

  const picture=
   article.image_url||
   article.photo_illustration_url||
   article.photo_url;

  const card=el("article","card");

  const open=()=>openModal(title,box=>{
   gallery(box,[picture],title);
   if(article.date)box.appendChild(
    el("p","muted",article.date)
   );
   description(
    box,
    article.contenu||
    article.texte||
    article.description_longue||
    article.description
   );
   video(box,article.video_url);
  });

  const img=image(card,picture,title);
  if(img){
   img.style.cursor="pointer";
   img.addEventListener("click",open);
  }

  card.appendChild(el("h3","",title));
  if(article.date)card.appendChild(
   el("p","muted",article.date)
  );
  card.appendChild(
   button("Lire l'article",open,true)
  );
  grid.appendChild(card);
 });

 section.appendChild(grid);
}

/* ==========================================
   BOUTIQUE
========================================== */

function addToCart(product,size){
 const stock=Number(product.stock);
 const available=
  Number.isFinite(stock)&&stock>=0?stock:0;

 const id=product.id||product.name;

 const already=state.cart
  .filter(x=>x.id===id)
  .reduce((sum,x)=>sum+x.quantity,0);

 if(already>=available){
  alert("Stock disponible atteint.");
  return false;
 }

 const existing=state.cart.find(
  x=>x.id===id&&x.size===size
 );

 if(existing)existing.quantity++;
 else state.cart.push({
  id,name:product.name,
  price:Number(product.price||0),
  size,quantity:1
 });

 return true;
}

async function eahSignIn(identifier,password){
 const value=String(identifier||"").trim();

 if(!value||!password)throw new Error(
  "Indiquez votre identifiant et votre mot de passe."
 );

 if(value.includes("@")){
  const {data,error}=
   await state.sb.auth.signInWithPassword({
    email:value.toLowerCase(),password
   });
  if(error)throw error;
  return data;
 }

 /*
  Connexion par identifiant :
  nécessite une fonction serveur eah-login.
  Aucun mot de passe n'est exposé dans une
  requête publique de recherche d'utilisateur.
 */

 const response=await fetch(
  SUPABASE_URL+"/functions/v1/eah-login",{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    apikey:PUBLIC_KEY
   },
   body:JSON.stringify({
    identifier:value,
    password,
    clubSlug:CLUB_SLUG
   })
  }
 );

 let result={};
 try{result=await response.json()}catch(e){}

 if(!response.ok||!result.session){
  throw new Error(
   result.error||
   "Connexion par identifiant indisponible. "+
   "Utilisez votre e-mail ou configurez "+
   "la fonction serveur eah-login."
  );
 }

 const {data,error}=await state.sb.auth.setSession({
  access_token:result.session.access_token,
  refresh_token:result.session.refresh_token
 });

 if(error)throw error;
 return data;
}

function showPage(slug){
 const target=String(slug||"").toLowerCase();
 const exists=state.pages.some(
  p=>String(p.slug).toLowerCase()===target
 );
 if(!exists)return;

 state.currentPage=target;

 document.querySelectorAll(".page").forEach(s=>{
  s.classList.toggle(
   "active",s.dataset.slug===target
  );
 });

 document.querySelectorAll("#menu button").forEach(b=>{
  b.classList.toggle(
   "active",b.dataset.slug===target
  );
 });

 renderHeader();

 const hash="#"+encodeURIComponent(target);

 if(location.hash!==hash){
  history.replaceState(
   null,"",
   location.pathname+location.search+hash
  );
 }

 window.scrollTo({top:0,behavior:"smooth"});
}

function renderPages(preferred){

 menu.replaceChildren();
 pages.replaceChildren();

 state.pages.forEach(page=>{
  const slug=String(page.slug||"").toLowerCase();

  const nav=button(
   page.title||slug,()=>showPage(slug)
  );

  menu.appendChild(nav);

  const section=el("section","page");
  section.dataset.slug=slug;

   el("h2","",page.title||slug)
  );

   if(slug==="boutique")
    renderBoutique(page,section);
   else if(slug==="espace-club")
    renderClubSpace(section);
   else
    renderStandard(page,section);
  }catch(error){
   console.error("Page :",slug,error);
   section.appendChild(
    el("p","status error",
     "Erreur : "+error.message)
   );
  }

  pages.appendChild(section);
 });

 let requested=
  preferred||
  state.currentPage||
  decodeURIComponent(location.hash.slice(1));

 const exists=state.pages.some(
  p=>String(p.slug).toLowerCase()===requested
 );

 if(!exists)
  requested=String(state.pages[0].slug).toLowerCase();

 showPage(requested);
}

 url.hash="";
 [
  "code","error","error_description",
  "access_token","refresh_token",

 ].forEach(k=>url.searchParams.delete(k));
 return url.toString();

function nfcPhotoUrl(value){
 const raw=String(value||"").trim();
 if(!raw)return "";

 const patterns=[
  /drive\.google\.com\/file\/d\/([\w-]+)/i,
  /drive\.google\.com\/open\?[^#]*[?&]id=([\w-]+)/i,
  /drive\.google\.com\/uc\?[^#]*[?&]id=([\w-]+)/i,
  /drive\.google\.com\/thumbnail\?[^#]*[?&]id=([\w-]+)/i
 ];

 for(const pattern of patterns){
  const match=raw.match(pattern);
  if(match)return "https://drive.google.com/thumbnail?id="+
   encodeURIComponent(match[1])+"&sz=w1000";
 }

 if(/^[\w-]{20,}$/.test(raw))
  return "https://drive.google.com/thumbnail?id="+
   encodeURIComponent(raw)+"&sz=w1000";

 try{
  const url=new URL(raw);
  return url.protocol==="https:"?url.href:"";
 }catch(e){
  return "";
 }
}

async function nfcUploadPhoto(file){
 if(!file)return null;

 const types={
  "image/jpeg":"jpg",
  "image/png":"png",
  "image/webp":"webp"
 };

 if(!types[file.type])
  throw new Error("Utilisez JPG, PNG ou WebP.");

 if(file.size>3*1024*1024)
  throw new Error("Photo supérieure à 3 Mo.");

 const {data:auth,error:authError}=
  await state.sb.auth.getUser();

 if(authError||!auth?.user)
  throw new Error("Connexion nécessaire.");

 const path=auth.user.id+"/"+crypto.randomUUID()+
  "."+types[file.type];

 const {error}=await state.sb.storage
  .from("eah-nfc-profiles")
  .upload(path,file,{
   contentType:file.type,upsert:false
  });

 if(error)throw error;

 return state.sb.storage
  .from("eah-nfc-profiles")
  .getPublicUrl(path).data.publicUrl;
}

/* ==========================================
   NFC - SAUVEGARDE TEMPORAIRE
========================================== */

function nfcPendingKey(){
 return "eah_nfc_pending_"+CLUB_SLUG+"_"+NFC_TOKEN;
}

function nfcSavePending(data){
 /*
  Aucune sauvegarde du mot de passe.
  localStorage conserve uniquement les
  informations du formulaire.
 */
 const safe={
  first:data.first||"",
  last:data.last||"",
  id:data.id||"",
  email:data.email||"",
  groupId:data.groupId||"",
  coachId:data.coachId||"",
  driveUrl:data.driveUrl||""
 };

 localStorage.setItem(
  nfcPendingKey(),JSON.stringify(safe)
 );
}

function nfcReadPending(){
 try{
  const raw=localStorage.getItem(nfcPendingKey())||
   sessionStorage.getItem(nfcPendingKey());
  return raw?JSON.parse(raw):null;
 }catch(e){
  return null;
 }
}

function nfcClearPending(){
 localStorage.removeItem(nfcPendingKey());
 sessionStorage.removeItem(nfcPendingKey());
}

/* ==========================================
   NFC - INFORMATIONS DEPUIS SUPABASE AUTH
========================================== */

function nfcDataFromUser(user){
 const m=object(user?.user_metadata);

 if(
  m.nfc_club_slug!==CLUB_SLUG||
  m.nfc_token!==NFC_TOKEN
 ){
  return null;
 }

 return {
  first:String(m.first_name||"").trim(),
  last:String(m.last_name||"").trim(),
  id:String(m.eah_id_requested||"").trim(),
  email:String(user.email||"").toLowerCase(),
  groupId:m.nfc_group_id||null,
  coachId:m.nfc_coach_id||null,
  driveUrl:m.nfc_drive_url||""
 };
}

function nfcGetActivationData(user){
 /*
  Les métadonnées du compte sont prioritaires.
  Elles survivent au changement d'onglet
  et au clic depuis une application e-mail.
 */
 const metadata=nfcDataFromUser(user);
 if(metadata)return metadata;

 const pending=nfcReadPending();
 if(!pending)return null;

 if(
  String(pending.email||"").toLowerCase()!==
  String(user.email||"").toLowerCase()
 ){
  return null;
 }

 return pending;
}

/* ==========================================
   NFC - ACTIVATION APRES CONFIRMATION
========================================== */

let nfcActivationBusy=false;

async function nfcFinishActivation(data,file=null){
 if(nfcActivationBusy)return false;

 nfcActivationBusy=true;

 try{
  const {data:auth,error:authError}=
   await state.sb.auth.getUser();

  if(authError||!auth?.user)
   throw new Error("Compte non connecté.");

  const user=auth.user;

  if(!user.email_confirmed_at){
   throw new Error(
    "Confirmez d'abord votre adresse e-mail."
   );
  }

  if(
   String(user.email).toLowerCase()!==
   String(data.email).toLowerCase()
  ){
   throw new Error(
    "L'adresse e-mail ne correspond pas au compte connecté."
   );
  }

  if(!data.first||!data.last)
   throw new Error("Nom et prénom manquants.");

  const before=await nfcProfile();

  if(String(before?.status||"").toUpperCase()==="ACTIVE"){
   nfcClearPending();
   await renderNfc();
   return true;
  }

  const eahId=await nfcActivate(
   data.first,
   data.last,
   data.id
  );

  const profile=await nfcProfile();

  if(String(profile?.status||"").toUpperCase()!=="ACTIVE"){
   throw new Error(
    "La carte NFC n'a pas été activée."
   );
  }

  if(
   data.id&&
   String(profile.eah_id||"").toLowerCase()!==
   data.id.toLowerCase()
  ){
   throw new Error(
    "L'identifiant personnalisé n'a pas été enregistré."
   );
  }

  let detailsError=null;

  try{
   await nfcSaveDetails(
    data.groupId,
    data.coachId,
    file,
    data.driveUrl
   );
  }catch(error){
   detailsError=error;
   console.warn("Détails NFC :",error);
  }

  nfcClearPending();

  console.info("EAH ID activé :",eahId);

  await renderNfc();

  if(detailsError){
   const panel=document.querySelector("#pages .panel");
   if(panel)panel.appendChild(
    el("p","status error",
     "Profil créé. Certaines informations complémentaires "+
     "n'ont pas été enregistrées : "+detailsError.message
    )
   );
  }

  return true;

 }finally{
  nfcActivationBusy=false;
 }
}

/* ==========================================
   NFC - REPRISE AUTOMATIQUE
========================================== */

async function nfcResumeAfterConfirmation(){
 if(!state.sb||!NFC_TOKEN||nfcActivationBusy)return;

 const {data:auth,error}=await state.sb.auth.getUser();

 if(error||!auth?.user)return;

 const user=auth.user;

 if(!user.email_confirmed_at)return;

 const profile=await nfcProfile();

 if(String(profile?.status||"").toUpperCase()==="ACTIVE"){
  nfcClearPending();
  return;
 }

 const data=nfcGetActivationData(user);

 if(!data)return;

 await nfcFinishActivation(data,null);
}

 heading.textContent=
  profile?.name||card.profile_name||"Profil EAH Diving";

 const photoUrl=nfcPhotoUrl(profile?.photo_url);

 if(photoUrl){
  image(panel,photoUrl,"Photo du profil","nfc-photo");
 }

 description(
  panel,profile?.club_name||card.club_name
 );

 panel.appendChild(
  el("p","nfc-id",
   "EAH ID : "+
   (profile?.eah_id||card.profile_eah_id||"")
  )
 );

 if(profile?.group_name)panel.appendChild(
  el("p","","Groupe : "+profile.group_name)
 );

 if(profile?.coach_name)panel.appendChild(
  el("p","","Coach : "+profile.coach_name)
 );

 panel.appendChild(
  el("p","status success",
   "Votre profil EAH Diving est actif ! "+
   "Votre carte NFC est attribuée."
  )
 );

 const actions=el("div","nfc-actions");

 actions.appendChild(
  button("Actualiser mon profil",()=>{
   renderNfc().catch(console.error);
  },true)
 );

 const {data:auth}=await state.sb.auth.getUser();

 if(auth?.user){
  actions.appendChild(
   button("Se déconnecter",async()=>{
    await state.sb.auth.signOut();
    await renderNfc();
   })
  );
 }

 panel.appendChild(actions);
}

/* ==========================================
   NFC - FORMULAIRE COMPLET
========================================== */

async function renderNfc(){
 const pages=nfcMode();
 const panel=el("section","panel");
 const heading=el("h2","","Carte NFC EAH Diving");
 const feedback=el("div");

 panel.append(heading,feedback);
 pages.appendChild(panel);

 if(!state.sb){
  message(feedback,"Supabase indisponible.",true);
  return;
 }

 try{
  const card=await nfcLookup();
  if(!card)throw new Error("Carte NFC introuvable.");

  const profile=await nfcProfile();

  if(
   String(profile?.status||card.card_status)
    .toUpperCase()==="ACTIVE"
  ){
   await renderNfcActive(
    panel,heading,profile,card
   );
   return;
  }

  const {data:auth}=await state.sb.auth.getUser();
  const connectedUser=auth?.user||null;

  let options={groups:[],coaches:[]};

  try{
   options=await nfcOptions();
  }catch(error){
   console.warn("Options NFC :",error.message);
  }

  heading.textContent="Créer mon profil EAH";

  description(
   panel,
   "Carte n° "+(card.card_number||"")+
   " — "+(card.club_name||"")+
   "\n\nComplétez le formulaire. "+
   "Vous recevrez un e-mail de confirmation. "+
   "Après confirmation, votre carte NFC sera "+
   "automatiquement attribuée à votre profil."
  );

  const form=el("form","form");

  const first=field(form,"Prénom","text");
  const last=field(form,"Nom","text");

  const id=field(
   form,
   "Identifiant EAH personnalisé (facultatif)",
   "text",false
  );

  id.placeholder=card.default_identifier||"";
  id.pattern="[A-Za-z0-9_-]{4,32}";
  id.maxLength=32;

  const email=field(
   form,"Adresse e-mail","email"
  );

  const password=field(
   form,"Choisir un mot de passe","password"
  );
  password.minLength=8;
  password.autocomplete="new-password";

  const confirmPassword=field(
   form,"Confirmer le mot de passe","password"
  );
  confirmPassword.minLength=8;
  confirmPassword.autocomplete="new-password";

  const photoLabel=el(
   "label","","Photo du profil (fichier)"
  );
  const photoInput=el("input");
  photoInput.type="file";
  photoInput.accept=
   "image/jpeg,image/png,image/webp";
  photoLabel.appendChild(photoInput);

  const driveLabel=el(
   "label","","Ou lien Google Drive de la photo"
  );
  const driveInput=el("input");
  driveInput.type="url";
  driveInput.required=false;
  driveInput.placeholder=
   "https://drive.google.com/file/d/.../view";
  driveLabel.appendChild(driveInput);

  const preview=el("img");
  preview.hidden=true;
  preview.className="nfc-photo";

  let previewUrl=null;

  function updatePhotoPreview(){
   if(previewUrl){
    URL.revokeObjectURL(previewUrl);
    previewUrl=null;
   }

   const file=photoInput.files?.[0];

   if(file){
    previewUrl=URL.createObjectURL(file);
    preview.src=previewUrl;
    preview.hidden=false;
    return;
   }

   const drive=nfcPhotoUrl(driveInput.value);

   if(drive){
    preview.src=drive;
    preview.hidden=false;
   }else{
    preview.hidden=true;
   }
  }

  photoInput.addEventListener(
   "change",updatePhotoPreview
  );
  driveInput.addEventListener(
   "input",updatePhotoPreview
  );
  preview.onerror=()=>preview.hidden=true;

  form.append(photoLabel,driveLabel,preview);

  const group=nfcSelect(
   form,"Groupe d'affectation",options.groups
  );

  const coach=nfcSelect(
   form,"Coach associé au profil",options.coaches
  );

  const submit=el(
   "button","primary-button",
   "Créer mon compte et recevoir le mail"
  );
  submit.type="submit";

  form.appendChild(submit);
  panel.appendChild(form);

  const pending=nfcReadPending();

  if(pending){
   first.value=pending.first||"";
   last.value=pending.last||"";
   id.value=pending.id||"";
   email.value=pending.email||"";
   group.value=pending.groupId||"";
   coach.value=pending.coachId||"";
   driveInput.value=pending.driveUrl||"";
   updatePhotoPreview();
  }

  function collectForm(){
   return {
    first:first.value.trim(),
    last:last.value.trim(),
    id:id.value.trim(),
    email:email.value.trim().toLowerCase(),
    groupId:group.value||null,
    coachId:coach.value||null,
    driveUrl:driveInput.value.trim()
   };
  }

  /* ======================================
     CREATION DU COMPTE AVEC CONFIRMATION
  ====================================== */

  form.addEventListener("submit",async event=>{
   event.preventDefault();
   submit.disabled=true;
   submit.textContent="Création en cours...";

   try{
    const data=collectForm();
    const mdp=password.value;

    if(!data.first||!data.last||!data.email)
     throw new Error(
      "Complétez les champs obligatoires."
     );

    if(mdp.length<8)
     throw new Error(
      "Le mot de passe doit contenir au moins 8 caractères."
     );

    if(mdp!==confirmPassword.value)
     throw new Error(
      "Les mots de passe ne correspondent pas."
     );

    if(data.id&&!/^[A-Za-z0-9_-]{4,32}$/.test(data.id))
     throw new Error(
      "Identifiant invalide : 4 à 32 caractères."
     );

    nfcSavePending(data);

    const {data:current}=await state.sb.auth.getUser();

    if(current?.user){
     if(
      current.user.email?.toLowerCase()!==
      data.email
     ){
      throw new Error(
       "Un autre compte est connecté. "+
       "Déconnectez-vous avant de continuer."
      );
     }

     await nfcFinishActivation(
      data,photoInput.files?.[0]||null
     );
     return;
    }

    const redirect=nfcRedirect();

    const {data:signup,error}=await state.sb.auth.signUp({
     email:data.email,
     password:mdp,
     options:{
      emailRedirectTo:redirect,
      data:{
       first_name:data.first,
       last_name:data.last,
       eah_id_requested:data.id,
       nfc_club_slug:CLUB_SLUG,
       nfc_token:NFC_TOKEN,
       nfc_group_id:data.groupId,
       nfc_coach_id:data.coachId,
       nfc_drive_url:data.driveUrl
      }
     }
    });

    if(error)throw error;

    if(signup.session){
     await nfcFinishActivation(
      data,photoInput.files?.[0]||null
     );
     return;
    }

    message(
     feedback,
     "Votre demande d'inscription a été enregistrée.\n\n"+
     "Un e-mail de confirmation a été demandé pour : "+
     data.email+
     "\n\nCliquez sur le bouton de confirmation "+
     "dans le mail pour accéder à votre profil.\n\n"+
     "Votre nom, votre prénom et votre identifiant "+
     "EAH ont été transmis à Supabase.\n\n"+
     "Vérifiez aussi les courriers indésirables.\n\n"+
     "Si cette adresse possède déjà un compte, "+
     "utilisez la connexion existante."
    );

   }catch(error){
    console.error("Création EAH :",error);
    message(
     feedback,
     "Création impossible : "+error.message,
     true
    );
   }finally{
    submit.disabled=false;
    submit.textContent=
     "Créer mon compte et recevoir le mail";
   }
  });

  /* ======================================
     COMPTE DEJA CONNECTE
  ====================================== */

  if(connectedUser){
   const connected=el(
    "div","status",
    "Compte connecté : "+connectedUser.email
   );

   panel.insertBefore(connected,form);

   panel.insertBefore(
    button("Changer de compte",async()=>{
     await state.sb.auth.signOut();
     await renderNfc();
    }),
    form
   );
  }

  /* ======================================
     CONNEXION EXISTANTE
  ====================================== */

  panel.appendChild(el("hr","nfc-divider"));

  const details=el("details");
  details.appendChild(
   el("summary","","Déjà inscrit ? Se connecter")
  );

  const login=el("form","form");

  const loginIdentifier=field(
   login,"E-mail ou identifiant EAH","text"
  );

  const loginPassword=field(
   login,"Mot de passe","password"
  );

  const loginButton=el(
   "button","primary-button",
   "Se connecter et activer ma carte"
  );
  loginButton.type="submit";

  const loginFeedback=el("div");

  login.append(loginButton,loginFeedback);
  details.appendChild(login);
  panel.appendChild(details);

  login.addEventListener("submit",async event=>{
   event.preventDefault();
   loginButton.disabled=true;

   try{
    await eahSignIn(
     loginIdentifier.value,
     loginPassword.value
    );

    const {data:auth,error}=await state.sb.auth.getUser();

    if(error||!auth?.user)
     throw new Error("Connexion non confirmée.");

    const user=auth.user;

    const saved=nfcGetActivationData(user)||{};
    const entered=collectForm();

    const data={
     first:entered.first||
      saved.first||
      user.user_metadata?.first_name||"",
     last:entered.last||
      saved.last||
      user.user_metadata?.last_name||"",
     id:entered.id||
      saved.id||
      user.user_metadata?.eah_id_requested||"",
     email:user.email.toLowerCase(),
     groupId:entered.groupId||saved.groupId||null,
     coachId:entered.coachId||saved.coachId||null,
     driveUrl:entered.driveUrl||saved.driveUrl||""
    };

    if(!data.first||!data.last){
     throw new Error(
      "Renseignez votre nom et votre prénom "+
      "dans le formulaire."
     );
    }

    await nfcFinishActivation(
     data,photoInput.files?.[0]||null
    );

   }catch(error){
    message(loginFeedback,error.message,true);
   }finally{
    loginButton.disabled=false;
   }
  });

  /* ======================================
     RENVOI CONFIRMATION
  ====================================== */

  const resend=button(
   "Renvoyer le mail de confirmation",
   async()=>{
    resend.disabled=true;

    try{
     const address=email.value.trim().toLowerCase();

     if(!address)
      throw new Error(
       "Indiquez votre adresse e-mail."
      );

     const {error}=await state.sb.auth.resend({
      type:"signup",
      email:address,
      options:{
       emailRedirectTo:nfcRedirect()
      }
     });

     if(error)throw error;

     message(
      feedback,
      "Demande de renvoi effectuée. "+
      "Consultez votre boîte mail et vos spams."
     );

    }catch(error){
     message(feedback,error.message,true);
    }finally{
     resend.disabled=false;
    }
   }
  );

  panel.appendChild(resend);

 }catch(error){
  console.error("NFC :",error);
  message(
   feedback,"Erreur NFC : "+error.message,true
  );
 }
}

/* ==========================================
   RECUPERATION MOT DE PASSE
========================================== */

async function renderNfcRecovery(){
 const pages=nfcMode();
 const panel=el("section","panel");

 panel.appendChild(
  el("h2","","Définir mon nouveau mot de passe")
 );

 const form=el("form","form");
 const password=field(
  form,"Nouveau mot de passe","password"
 );
 password.minLength=8;

 const confirm=field(
  form,"Confirmer le mot de passe","password"
 );
 confirm.minLength=8;

 const submit=el(
  "button","primary-button","Enregistrer"
 );
 submit.type="submit";

 const feedback=el("div");
 form.append(password,confirm,submit,feedback);
 panel.appendChild(form);
 pages.appendChild(panel);

 form.addEventListener("submit",async event=>{
  event.preventDefault();
  submit.disabled=true;

  try{
   if(password.value!==confirm.value)
    throw new Error(
     "Les mots de passe sont différents."
    );

   if(password.value.length<8)
    throw new Error("Minimum 8 caractères.");

   const {error}=await state.sb.auth.updateUser({
    password:password.value
   });

   if(error)throw error;

   message(
    feedback,"Mot de passe modifié avec succès."
   );

   form.reset();

   panel.appendChild(
    button("Retour à mon profil",()=>renderNfc())
   );

  }catch(error){
   message(feedback,error.message,true);
  }finally{
   submit.disabled=false;
  }
 });
}

function nfcIsRecovery(){
 const hash=new URLSearchParams(
  location.hash.slice(1)
 );
 return hash.get("type")==="recovery";
}

/* ==========================================
   TRAITEMENT DU RETOUR EMAIL
========================================== */

async function nfcHandleAuthReturn(){
 /*
  Avec la configuration client ci-dessous,
  Supabase traite automatiquement les liens
  de confirmation au format implicite.

  La session est récupérée avant de tenter
  l'activation du profil.
 */

 const url=new URL(location.href);
 const code=url.searchParams.get("code");

 if(code){
  const {error}=await state.sb.auth
   .exchangeCodeForSession(code);

  if(error)throw error;

  url.searchParams.delete("code");
  history.replaceState(null,"",url.toString());
 }

 const hashParams=new URLSearchParams(
  location.hash.slice(1)
 );

 const authError=
  url.searchParams.get("error_description")||
  hashParams.get("error_description");

 if(authError){
  throw new Error(
   "Confirmation du compte : "+authError
  );
 }

 const {data,error}=await state.sb.auth.getSession();

 if(error)throw error;

 return data?.session||null;
}

/* ==========================================
   ACTUALISATION PUBLIQUE
========================================== */

let refreshBusy=false;

async function refreshPublic(){
 if(
  refreshBusy||NFC_TOKEN||!state.club||
  state.cart.length||
  document.activeElement?.matches(
   "input,textarea,select"
  )
 )return;

 refreshBusy=true;

 try{
  const page=state.currentPage;
  await loadClub();
  renderPages(page);
 }catch(error){
  console.warn("Actualisation :",error.message);
 }finally{
  refreshBusy=false;
 }
}

/* ==========================================
   DEMARRAGE
========================================== */

async function start(){
 try{
  if(!window.supabase?.createClient){
   throw new Error(
    "Bibliothèque Supabase indisponible."
   );
  }

  state.sb=window.supabase.createClient(
   SUPABASE_URL,
   PUBLIC_KEY,
   {
    auth:{
     persistSession:true,
     autoRefreshToken:true,
     detectSessionInUrl:true,
     flowType:"implicit"
    }
   }
  );

  /* ======================================
     MODE NFC
  ====================================== */

  if(NFC_TOKEN){
   let authReturnError=null;

   try{
    await nfcHandleAuthReturn();
   }catch(error){
    authReturnError=error;
    console.error("Retour e-mail :",error);
   }

   if(nfcIsRecovery()){
    await renderNfcRecovery();
   }else{
    await renderNfc();

    if(authReturnError){
     const panel=document.querySelector(
      "#pages .panel"
     );
     if(panel)panel.prepend(
      el("div","status error",
       authReturnError.message
      )
     );
    }else{
     try{
      await nfcResumeAfterConfirmation();
     }catch(error){
      console.error("Activation NFC :",error);

      const panel=document.querySelector(
       "#pages .panel"
      );

      if(panel)panel.prepend(
       el("div","status error",
        "Compte confirmé, mais activation "+
        "du profil impossible : "+error.message
       )
      );
     }
    }
   }

   state.sb.auth.onAuthStateChange(event=>{
    if(event==="PASSWORD_RECOVERY"){
     setTimeout(()=>{
      renderNfcRecovery().catch(console.error);
     },0);
    }
   });

   return;
  }

  /* ======================================
     SITE CLUB
  ====================================== */

  await loadClub();

  $("loading").hidden=true;
  $("app").hidden=false;

  renderPages();

  refreshMember().then(()=>{
   if(state.currentPage==="espace-club")
    renderPages("espace-club");
  }).catch(console.warn);

  setInterval(()=>{
   if(!document.hidden)refreshPublic();
  },60000);

  document.addEventListener(
   "visibilitychange",()=>{
    if(!document.hidden)refreshPublic();
   }
  );

  window.addEventListener("hashchange",()=>{
   const slug=decodeURIComponent(
    location.hash.slice(1)
   );
   if(slug)showPage(slug);
  });

  console.info("EAH Diving Club démarré.");

 }catch(error){
  console.error("Démarrage EAH :",error);

  $("loading").replaceChildren(
   el("div","status error",
    "Impossible de charger le club.\n"+
    (error.message||"Erreur inconnue")
   )
  );
 }
}

/* LANCEMENT */

start();

})();
</script>
