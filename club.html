<script>
(function(){
"use strict";

/* =====================================================
   EAH DIVING CLUB
   VERSION NFC SANS EMAIL

   - Site multi-club
   - Pages publiques
   - Disciplines
   - Blazons
   - Actualités
   - Boutique
   - Espace club
   - Administration
   - Création directe des profils NFC
   - Identifiant personnalisé
   - Photo Google Drive / URL
   - Affichage automatique du profil
===================================================== */

const SUPABASE_URL =
  "https://limyeqpdzjjwsdximehp.supabase.co";

const PUBLIC_KEY =
  "sb_publishable_K9iUm_0Qhea65P1Zt6rbXQ_BXQCzJ9w";

const DEFAULT_CLUB =
  "eah-club-demo-1793054157740";

const params = new URLSearchParams(location.search);

const CLUB_SLUG =
  params.get("club") ||
  params.get("eah_club_preview") ||
  DEFAULT_CLUB;

const NFC_TOKEN = params.get("nfc");

const $ = id => document.getElementById(id);

const MANAGER_ROLES = [
  "admin","owner","manager","responsable"
];

const state = {
  club:null,
  config:{},
  pages:[],
  badges:[],
  products:[],
  cart:[],
  user:null,
  member:null,
  currentPage:"",
  sb:null,
  nfcBusy:false
};

/* =====================================================
   OUTILS GENERAUX
===================================================== */

function el(tag,cls="",value){
  const element = document.createElement(tag);
  if(cls) element.className = cls;
  if(value !== undefined){
    element.textContent = String(value ?? "");
  }
  return element;
}

function button(label,handler,primary=false){
  const b = el(
    "button",
    primary ? "primary-button" : "",
    label
  );
  b.type = "button";
  if(handler) b.addEventListener("click",handler);
  return b;
}

function message(parent,text,error=false){
  parent.replaceChildren(
    el(
      "div",
      "status " + (error ? "error" : "success"),
      text
    )
  );
}

function money(value){
  return Number(value || 0).toLocaleString(
    "fr-FR",
    {style:"currency",currency:"EUR"}
  );
}

function array(value){
  return Array.isArray(value) ? value : [];
}

function object(value){
  return value &&
    typeof value === "object" &&
    !Array.isArray(value)
      ? value
      : {};
}

function description(parent,text){
  if(!text) return;
  parent.appendChild(el("p","description",text));
}

function safeImage(value){
  if(!value) return "";
  const raw = String(value).trim();

  let match = raw.match(
    /drive\.google\.com\/file\/d\/([\w-]+)/
  );

  if(!match){
    match = raw.match(/[?&]id=([\w-]{20,})/);
  }

  if(!match && /^[\w-]{20,}$/.test(raw)){
    match = [raw,raw];
  }

  if(match){
    return (
      "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(match[1]) +
      "&sz=w1000"
    );
  }

  try{
    const url = new URL(raw,location.href);
    if(["https:","http:"].includes(url.protocol)){
      return url.href;
    }
  }catch(error){}

  return "";
}

function image(parent,url,alt,cls=""){
  const src = safeImage(url);
  if(!src) return null;

  const img = el("img",cls);
  img.src = src;
  img.alt = alt || "";
  img.loading = "lazy";
  img.onerror = () => { img.hidden = true; };
  parent.appendChild(img);
  return img;
}

function video(parent,url){
  const src = safeImage(url);
  if(!src) return;

  if(/\.(mp4|webm|ogg)([?#]|$)/i.test(src)){
    const v = el("video","page-video");
    v.src = src;
    v.controls = true;
    v.preload = "metadata";
    parent.appendChild(v);
  }else{
    const a = el("a","","Voir la vidéo");
    a.href = src;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    parent.appendChild(a);
  }
}

function safeColor(value,fallback){
  const colors = {
    "bleu":"#0b6bff",
    "bleu marine":"#102040",
    "bleu clair":"#70c8ff",
    "orange":"#ff9800",
    "vert":"#23a455",
    "rouge":"#e53935",
    "blanc":"#ffffff",
    "noir":"#000000",
    "gris":"#808080",
    "jaune":"#ffd600",
    "rose":"#ff69b4",
    "violet":"#9333ea"
  };

  const text = String(value || "").trim();

  return colors[text.toLowerCase()] ||
    (
      /^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(text)
        ? text
        : fallback
    );
}

function numeric(value,fallback,min,max){
  const n = Number(value);
  return value !== "" &&
    value != null &&
    Number.isFinite(n) &&
    n >= min &&
    n <= max
      ? n
      : fallback;
}

function field(parent,title,type,required=true){
  const label = el("label","",title);
  const input = el("input");
  input.type = type;
  input.required = required;
  label.appendChild(input);
  parent.appendChild(label);
  return input;
}

function normalizeEmail(value){
  return String(value || "").trim().toLowerCase();
}

function errorText(error){
  return error?.message ||
    String(error || "Erreur inconnue");
}

function setBusy(element,busy,text){
  if(!element) return;

  if(!element.dataset.originalText){
    element.dataset.originalText =
      element.textContent;
  }

  element.disabled = busy;
  element.textContent = busy
    ? (text || "Veuillez patienter...")
    : element.dataset.originalText;
}

/* =====================================================
   SUPABASE
===================================================== */

async function publicQuery(table,extra=""){
  const url =
    SUPABASE_URL +
    "/rest/v1/" +
    encodeURIComponent(table) +
    "?select=*" +
    extra;

  const controller = new AbortController();
  const timeout = setTimeout(
    () => controller.abort(),12000
  );

  try{
    const response = await fetch(url,{
      headers:{
        apikey:PUBLIC_KEY,
        Authorization:"Bearer " + PUBLIC_KEY,
        Accept:"application/json"
      },
      signal:controller.signal,
      cache:"no-store"
    });

    if(!response.ok){
      const body = await response.text();
      throw new Error(
        table + " : HTTP " +
        response.status + " " +
        body.slice(0,150)
      );
    }

    return await response.json();
  }finally{
    clearTimeout(timeout);
  }
}

async function loadClub(){
  const clubs = await publicQuery(
    "clubs",
    "&slug=eq." +
    encodeURIComponent(CLUB_SLUG) +
    "&limit=1"
  );

  if(!clubs.length){
    throw new Error(
      "Club introuvable : " + CLUB_SLUG
    );
  }

  const club = clubs[0];
  const id = encodeURIComponent(club.id);

  const requests = [
    ["config","eah_club_site_config",
      "&club_id=eq." + id],
    ["pages","eah_club_pages",
      "&club_id=eq." + id +
      "&active=eq.true&order=sort_order.asc"],
    ["badges","eah_club_badges",
      "&club_id=eq." + id +
      "&active=eq.true&order=sort_order.asc"],
    ["products","eah_club_products",
      "&club_id=eq." + id +
      "&active=eq.true&order=sort_order.asc"]
  ];

  const results = await Promise.allSettled(
    requests.map(r => publicQuery(r[1],r[2]))
  );

  const data = {};

  results.forEach((result,index) => {
    const key = requests[index][0];

    if(result.status === "fulfilled"){
      data[key] = result.value;
    }else{
      console.warn(key,result.reason);
      data[key] = [];
    }
  });

  state.club = club;
  state.config = data.config[0] || {};
  state.pages = data.pages;
  state.badges = data.badges;
  state.products = data.products;

  if(!state.pages.length){
    state.pages = [{
      slug:"accueil",
      title:"Accueil",
      description:
        club.welcome_text ||
        "Bienvenue sur le site de votre club.",
      settings:{}
    }];
  }
}

/* =====================================================
   PERSONNALISATION
===================================================== */

function applyTheme(){
  const cfg = state.config;
  const s = object(cfg.settings);
  const c = state.club || {};

  const themes = {
    1:["#1478ff","#071725","#10243a",
       "#e8f2ff","#ffffff","#15324c"],
    2:["#c7a466","#101010","#171717",
       "#ede5d7","#f1d394","#24211c"],
    3:["#087e8b","#f3f6f8","#ffffff",
       "#263746","#183044","#ffffff"],
    4:["#a855f7","#140d1f","#21152f",
       "#f5efff","#ffffff","#302041"],
    5:["#7bc99c","#0d211e","#102c28",
       "#e6f5e9","#ffffff","#193b34"]
  };

  const theme =
    themes[Number(s.STYLE_NUMERO)] ||
    themes[1];

  const root = document.documentElement;

  const vars = {
    "--primary":safeColor(
      s.PRIMARY_COLOR ||
      cfg.primary_color ||
      c.primary_color,theme[0]
    ),
    "--secondary":safeColor(
      s.BACKGROUND_COLOR ||
      cfg.secondary_color,theme[1]
    ),
    "--text":safeColor(
      s.TEXT_COLOR,theme[3]
    ),
    "--card":safeColor(
      s.CARD_COLOR,theme[5]
    ),
    "--radius":
      numeric(s.CARD_RADIUS,14,0,40) + "px",
    "--overlay":
      numeric(s.HERO_OVERLAY,.58,0,1)
  };

  Object.entries(vars).forEach(([key,value]) => {
    root.style.setProperty(key,value);
  });

  const fonts = {
    "Arial":"Arial,sans-serif",
    "Roboto":"Roboto,Arial,sans-serif",
    "Verdana":"Verdana,sans-serif",
    "Georgia":"Georgia,serif",
    "Tahoma":"Tahoma,sans-serif",
    "Times New Roman":"Times New Roman,serif"
  };

  root.style.setProperty(
    "--font",
    fonts[s.FONT_FAMILY || s.TEXT_FONT] ||
    "Arial,sans-serif"
  );

  document.body.style.fontSize =
    numeric(s.TEXT_SIZE,16,10,32) + "px";

  const header = document.querySelector("header");

  if(header){
    header.style.backgroundColor =
      safeColor(s.HEADER_COLOR,theme[2]);
  }

  const background = safeImage(
    s.BACKGROUND_IMAGE_URL
  );

  document.body.style.backgroundImage =
    background ? `url("${background}")` : "none";

  document.body.style.backgroundSize = "cover";
  document.body.style.backgroundAttachment = "fixed";

  let style = $("eah-dynamic-style");

  if(!style){
    style = el("style");
    style.id = "eah-dynamic-style";
    document.head.appendChild(style);
  }

  const titleColor = safeColor(
    s.TITLE_COLOR,theme[4]
  );

  const titleSize = numeric(
    s.TITLE_SIZE,38,18,72
  );

  const heroSize = numeric(
    s.HERO_TITLE_SIZE || s.COVER_TEXT_SIZE,
    52,24,100
  );

  const cardSize = numeric(
    s.CARD_TITLE_SIZE,23,12,42
  );

  style.textContent = `
    .page h2{
      color:${titleColor};
      font-size:${titleSize}px;
    }
    .card h3{
      color:${titleColor};
      font-size:${cardSize}px;
    }
    .hero h1{
      font-size:clamp(30px,5vw,${heroSize}px);
    }
  `;
}

function renderHeader(){
  if(!state.club) return;

  const cfg = state.config;
  const c = state.club;
  const s = object(cfg.settings);

  applyTheme();

  const title =
    cfg.site_title ||
    c.name ||
    "EAH Diving Club";

  document.title = title;
  $("club-brand").textContent = title;
  $("footer-name").textContent = title;

  $("footer-text").textContent =
    s.FOOTER_TEXT ||
    "Propulsé par EAH Diving";

  const logo = safeImage(
    cfg.logo_url || c.logo_url
  );

  const logoEl = $("club-logo");
  logoEl.hidden = !logo;
  if(logo) logoEl.src = logo;
  logoEl.onerror = () => {
    logoEl.hidden = true;
  };

  const heroTitle = String(
    s.HERO_TITLE || ""
  ).trim();

  $("hero-title").textContent = heroTitle;
  $("hero-title").hidden = !heroTitle;

  $("hero-tagline").textContent =
    cfg.tagline ||
    c.welcome_text ||
    "";

  const page = state.pages.find(
    p => String(p.slug).toLowerCase() ===
      state.currentPage
  );

  const ps = object(page?.settings);

  const cover = safeImage(
    ps.cover_url ||
    ps.cover_image_url ||
    cfg.hero_url ||
    ""
  );

  $("hero").style.backgroundImage =
    cover ? `url("${cover}")` : "none";

  $("hero").style.minHeight =
    numeric(s.HERO_HEIGHT,360,200,1000) +
    "px";
}

/* =====================================================
   MODALES
===================================================== */

function openModal(title,builder){
  document.querySelector(".modal")?.remove();

  const overlay = el("div","modal");
  const box = el("div","modal-window");

  box.setAttribute("role","dialog");
  box.setAttribute("aria-modal","true");

  const close = button("✕",() => {
    overlay.remove();
  });

  close.className = "modal-close";

  box.appendChild(close);
  box.appendChild(el("h2","",title));

  builder(box);

  overlay.appendChild(box);
  document.body.appendChild(overlay);

  overlay.addEventListener("click",event => {
    if(event.target === overlay){
      overlay.remove();
    }
  });

  const escapeHandler = event => {
    if(event.key === "Escape"){
      overlay.remove();
      document.removeEventListener(
        "keydown",escapeHandler
      );
    }
  };

  document.addEventListener(
    "keydown",escapeHandler
  );

  close.focus();
}

function gallery(parent,photos,title){
  const urls = [...new Set(
    array(photos).map(safeImage).filter(Boolean)
  )];

  if(!urls.length) return;

  const main = image(
    parent,urls[0],title,"modal-media"

  if(urls.length < 2) return;

  const thumbs = el("div","gallery");

  urls.forEach((url,index) => {
    const b = button(
      "Photo " + (index+1),
      () => { main.src = url; }
    );

    b.textContent = "";
    image(b,url,"Photo " + (index+1));
    thumbs.appendChild(b);
  });

  parent.appendChild(thumbs);
}

function addToCart(product,size){
  const stock = Number(product.stock);

  const available =
    Number.isFinite(stock) && stock >= 0
      ? stock
      : 0;

  const id = product.id || product.name;

  const already = state.cart
    .filter(x => x.id === id)
    .reduce((sum,x) => sum + x.quantity,0);

  if(already >= available){
    alert("Stock disponible atteint.");
    return false;
  }

  const existing = state.cart.find(
    x => x.id === id && x.size === size
  );

  if(existing){
    existing.quantity++;
  }else{
    state.cart.push({
      id:id,
      name:product.name,
      price:Number(product.price || 0),
      size:size,
      quantity:1
    });
  }

  return true;
}

function renderCart(container){
  container.replaceChildren();
  container.appendChild(el("h3","","Mon panier"));

  if(!state.cart.length){
    container.appendChild(
      el("p","muted","Votre panier est vide.")
    );
    return;
  }

  state.cart.forEach((item,index) => {
    const line = el("div","cart-line");

    line.appendChild(
      el("span","",
        item.name +
        (item.size ? " — " + item.size : "") +
        " × " + item.quantity +
        " : " + money(item.price * item.quantity)
      )
    );

    line.appendChild(
      button("Retirer",() => {
        state.cart.splice(index,1);
        renderCart(container);
      })
    );

    container.appendChild(line);
  });

  const total = state.cart.reduce(
    (sum,x) => sum + x.price*x.quantity,0
  );

  container.appendChild(
    el("h3","",
      "Total indicatif : " + money(total))
  );

  container.appendChild(
    el("p","muted",
      "La validation des commandes nécessite " +
      "un contrôle serveur des prix et des stocks.")
  );
}

function renderBoutique(page,section){
  const s = object(page.settings);
  const enriched = array(s.products_v27);

  const products = enriched.length
    ? enriched
    : state.products;

  const grid = el("div","cards");

  const cartBox = el("div","panel");
  cartBox.style.marginTop = "25px";

  products.forEach(product => {
    if(product.active === false) return;

    const name = product.name || "Produit";

    const photos = array(product.images).length
      ? product.images
      : [product.image_url];

    const card = el("article","card");

    const open = () => {
      openModal(name,box => {
        gallery(box,photos,name);
        description(box,product.description);

        box.appendChild(
          el("p","price",money(product.price))
        );

        video(box,product.video_url);

        const sizes = array(product.sizes);
        const select = el("select");

        sizes.forEach(size => {
          const option = el("option","",size);
          option.value = String(size);
          select.appendChild(option);
        });

        if(sizes.length){
          box.appendChild(
            el("p","","Choisir une taille :")
          );
          box.appendChild(select);
        }

        box.appendChild(
          el("p","muted",
            "Stock : " + (product.stock ?? 0))
        );

        const add = button(
          "Ajouter au panier",
          () => {
            const added = addToCart(
              product,
              sizes.length ? select.value : ""
            );

            if(added){
              renderCart(cartBox);
              document.querySelector(".modal")?.remove();
            }
          },
          true
        );

          Number(product.stock) <= 0;

        box.appendChild(add);

    const img = image(card,photos[0],name);

    if(img){
      img.style.cursor = "pointer";

    card.appendChild(el("h3","",name));

      el("p","price",money(product.price))

      el("p","empty","Aucun article disponible.")

  section.appendChild(cartBox);
  renderCart(cartBox);

async function refreshMember(){
  if(!state.sb || !state.club) return;

  const result = await state.sb.auth.getUser();

  state.user = result.data?.user || null;
  state.member = null;

  if(!state.user) return;

  const response = await state.sb
    .from("club_members")
    .select("*")
    .eq("club_id",state.club.id)
    .eq("user_id",state.user.id)
    .eq("active",true)
    .maybeSingle();

  if(response.error){
    console.warn(
      "Accès club :",response.error.message
    );
    return;
  }

  state.member = response.data;
}

function isManager(){
  return Boolean(
    state.member &&
    MANAGER_ROLES.includes(
      String(state.member.role || "").toLowerCase()
    )
  );
}

function renderClubSpace(section){
  const box = el("div","panel");
  section.appendChild(box);

  if(!state.sb){
    message(
      box,"Service de connexion indisponible.",true
    );
    return;
  }

  if(!state.user){
    description(
      box,
      "Connexion réservée aux comptes " +
      "EAH Diving autorisés par le club."
    );

    const form = el("form","form");

    const email = field(
      form,"Adresse e-mail","email"
    );

    const password = field(
      form,"Mot de passe","password"
    );

    const submit = el(
      "button","primary-button","Se connecter"
    );

    submit.type = "submit";

    const feedback = el("div");

    form.append(submit,feedback);
    box.appendChild(form);

    form.addEventListener(
      "submit",
      async event => {
        event.preventDefault();
        setBusy(submit,true);

        try{
          const result =
            await state.sb.auth.signInWithPassword({
              email:normalizeEmail(email.value),
              password:password.value
            });

          if(result.error) throw result.error;

          await refreshMember();
          renderPages("espace-club");

        }catch(error){
          message(feedback,errorText(error),true);
        }finally{
          setBusy(submit,false);
        }
      }
    );

    return;
  }

  if(!state.member){
    message(
      box,
      "Votre compte est connecté, mais aucun " +
      "accès actif à ce club n'a été confirmé.",
      true
    );

    box.appendChild(
      button("Se déconnecter",async () => {
        await state.sb.auth.signOut();
        await refreshMember();
        renderPages("espace-club");
      })
    );

    return;
  }

  box.appendChild(
    el("h3","",
      "Bienvenue " +
      (
        state.member.display_name ||
        state.user.email ||
        ""
      )
    )
  );

  description(
    box,
    "Club : " + state.club.name +
    " — Rôle : " + state.member.role
  );

  box.appendChild(
    button("Se déconnecter",async () => {
      await state.sb.auth.signOut();
      await refreshMember();
      renderPages("espace-club");
    })
  );

  if(isManager()){
    renderManager(section);
  }
}

/* =====================================================
   ADMINISTRATION CLUB
===================================================== */

function renderManager(section){
  const box = el("div","panel");
  box.style.marginTop = "20px";

  box.appendChild(
    el("h3","","Personnaliser mon club")
  );

  description(
    box,
    "Importez votre logo JPG, PNG ou WebP " +
    "(maximum 3 Mo)."
  );

  const input = el("input");
  input.type = "file";
  input.accept = "image/png,image/jpeg,image/webp";

  const preview = el("img");
  preview.style.maxWidth = "180px";
  preview.style.maxHeight = "180px";
  preview.hidden = true;

  const feedback = el("div");

  let previewUrl = null;

  input.addEventListener("change",() => {
    const file = input.files?.[0];
    if(!file) return;

    if(previewUrl){
      URL.revokeObjectURL(previewUrl);
    }

    previewUrl = URL.createObjectURL(file);
    preview.src = previewUrl;
    preview.hidden = false;
  });

  const save = button(
    "Enregistrer mon logo",
    async () => {
      const file = input.files?.[0];

      if(!file){
        message(feedback,"Sélectionnez une image.",true);
        return;
      }

      if(![
        "image/png",
        "image/jpeg",
        "image/webp"
      ].includes(file.type)){
        message(feedback,"Format incorrect.",true);
        return;
      }

      if(file.size > 3*1024*1024){
        message(feedback,"Fichier supérieur à 3 Mo.",true);
        return;
      }

      setBusy(save,true);

      try{
        await refreshMember();

        if(!isManager()){
          throw new Error("Accès non autorisé.");
        }

        const ext = {
          "image/png":"png",
          "image/jpeg":"jpg",
          "image/webp":"webp"
        }[file.type];

        const unique =
          typeof crypto.randomUUID === "function"
            ? crypto.randomUUID()
            : String(Date.now());

        const path =
          state.club.id +
          "/logo-" + unique + "." + ext;

        const upload = await state.sb.storage
          .from("eah-club-logos")
          .upload(path,file,{
            contentType:file.type,
            upsert:false
          });

        if(upload.error) throw upload.error;

        const publicUrl = state.sb.storage
          .from("eah-club-logos")
          .getPublicUrl(path).data.publicUrl;

        const update = await state.sb
          .from("eah_club_site_config")
          .update({logo_url:publicUrl})
          .eq("club_id",state.club.id)
          .select("club_id,logo_url");

        if(update.error) throw update.error;

        if(!update.data?.length){
          throw new Error(
            "Mise à jour refusée. Vérifiez les autorisations RLS."
          );
        }

        state.config.logo_url = publicUrl;
        renderHeader();

        message(
          feedback,"Logo enregistré avec succès."
        );

      }catch(error){
        message(feedback,errorText(error),true);
      }finally{
        setBusy(save,false);
      }
    },
    true
  );

  box.append(input,preview,save,feedback);
  section.appendChild(box);

  const admin = el("div","panel");
  admin.style.marginTop = "20px";

  admin.appendChild(
    el("h3","","Administration du club")
  );

  description(
    admin,
    "Articles publics : " + state.products.length
  );

  const orders = el("div");

  orders.appendChild(
    el("h4","","Dernières commandes")
  );

  admin.appendChild(orders);
  section.appendChild(admin);

  state.sb
    .from("eah_club_orders")
    .select(
      "id,customer_name,total,status,payment_status,created_at"
    )
    .eq("club_id",state.club.id)
    .order("created_at",{ascending:false})
    .limit(20)
    .then(result => {
      if(result.error){
        orders.appendChild(
          el("p","status error",result.error.message)
        );
        return;
      }

      if(!result.data?.length){
        orders.appendChild(
          el("p","muted","Aucune commande.")
        );
        return;
      }

      result.data.forEach(order => {
        orders.appendChild(
          el("p","",
            new Date(order.created_at)
              .toLocaleDateString("fr-FR") +
            " — " + order.customer_name +
            " — " + money(order.total) +
            " — " + order.status
          )
        );
      });
    });
}

/* =====================================================
   MENU ET NAVIGATION
===================================================== */

function showPage(slug){
  const target = String(slug || "").toLowerCase();

  const exists = state.pages.some(
    p => String(p.slug).toLowerCase() === target
  );

  if(!exists) return;

  state.currentPage = target;

  document.querySelectorAll(".page")
    .forEach(section => {
      section.classList.toggle(
        "active",
        section.dataset.slug === target
      );
    });

  document.querySelectorAll("#menu button")
    .forEach(b => {
      b.classList.toggle(
        "active",
        b.dataset.slug === target
      );
    });

  renderHeader();

  const hash = "#" + encodeURIComponent(target);

  if(location.hash !== hash){
    history.replaceState(
      null,"",
      location.pathname + location.search + hash
    );
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function renderPages(preferred){
  const menu = $("menu");
  const pages = $("pages");

  menu.replaceChildren();
  pages.replaceChildren();

  state.pages.forEach(page => {
    const slug = String(
      page.slug || ""
    ).toLowerCase();

    const nav = button(
      page.title || slug,
      () => showPage(slug)
    );

    nav.dataset.slug = slug;
    menu.appendChild(nav);

    const section = el("section","page");
    section.dataset.slug = slug;

    section.appendChild(
      el("h2","",page.title || slug)
    );

    try{
      if(slug === "boutique"){
        renderBoutique(page,section);
      }else if(slug === "espace-club"){
        renderClubSpace(section);
      }else{
        renderStandard(page,section);
      }
    }catch(error){
      console.error("Page :",slug,error);

      section.appendChild(
        el("p","status error",
          "Erreur dans cette rubrique : " +
          errorText(error))
      );
    }

    pages.appendChild(section);
  });

  let requested =
    preferred ||
    state.currentPage ||
    decodeURIComponent(
      location.hash.slice(1)
    );

  const exists = state.pages.some(
    p => String(p.slug).toLowerCase() === requested
  );

  if(!exists){
    requested = String(
      state.pages[0].slug
    ).toLowerCase();
  }

  showPage(requested);
}

function nfcMode(){
  $("loading").hidden = true;
  $("app").hidden = false;

  $("app").querySelector("header").hidden = true;
  $("hero").hidden = true;
  $("app").querySelector("footer").hidden = true;

  pages.replaceChildren();
  pages.className = "nfc-container";

  return pages;
}

function nfcPhotoUrl(value){
  const raw = String(value || "").trim();
  if(!raw) return "";

  const patterns = [
    /drive\.google\.com\/file\/d\/([\w-]+)/i,
    /drive\.google\.com\/open\?[^#]*[?&]id=([\w-]+)/i,
    /drive\.google\.com\/uc\?[^#]*[?&]id=([\w-]+)/i,
    /drive\.google\.com\/thumbnail\?[^#]*[?&]id=([\w-]+)/i
  ];

  let id = "";

  for(const pattern of patterns){
    const match = raw.match(pattern);
    if(match){
      id = match[1];
      break;
    }
  }

  if(!id && /^[\w-]{20,}$/.test(raw)){
    id = raw;
  }

  if(id){
    return (
      "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(id) +
      "&sz=w1000"
    );
  }

  try{
    const url = new URL(raw);
    if(url.protocol !== "https:") return "";
    return url.href;
  }catch(error){
    return "";
  }
}

      p_last_name:data.last,
      p_eah_id:data.id || null,
      p_photo_url:data.photoUrl || null
    }
  );

  if(error) throw error;

  if(!result?.success){
    throw new Error(
      "La création du profil n'a pas été confirmée."
    );
  }

  return result;
}

/* =====================================================
   NFC - AFFICHAGE PROFIL
===================================================== */

function nfcRenderProfile(panel,profile,card){
  panel.replaceChildren();
  panel.classList.add("nfc-profile");

  panel.appendChild(
    el("div","nfc-logo","EAH DIVING")
  );

  panel.appendChild(
    el("h2","nfc-title",
      profile?.name ||
      card?.profile_name ||
      "Profil EAH Diving")
  );

  if(profile?.photo_url){
    image(
      panel,
      nfcPhotoUrl(profile.photo_url),
      "Photo du profil",
      "nfc-profile-photo"
    );
  }

  const info = el("div","nfc-info");

  info.appendChild(
    el("p","",
      profile?.club_name ||
      card?.club_name ||
      "")
  );

  const eahId =
    profile?.eah_id ||
    card?.profile_eah_id ||
    "";

  panel.appendChild(info);

  panel.appendChild(
    el("div","nfc-id","EAH ID : " + eahId)
  );

  if(profile?.group_name){
    panel.appendChild(
      el("p","","Groupe : " + profile.group_name)
    );
  }

  if(profile?.blazon){
    panel.appendChild(
      el("p","","Blazon : " + profile.blazon)
    );
  }

  panel.appendChild(
    el("p","status success",
      "Profil EAH Diving actif.")
  );

  const actions = el("div","nfc-actions");

  actions.appendChild(
    button("Copier le lien du profil",async () => {
      try{
        await navigator.clipboard.writeText(
          location.href.split("#")[0]
        );
        alert("Lien copié.");
      }catch(error){
        alert("Copie impossible.");
      }
    })
  );

  panel.appendChild(actions);

  panel.appendChild(
    el("p","nfc-help",
      "Cette carte NFC est associée à ce profil. " +
      "Chaque nouveau scan ouvre cette page.")
  );
}

/* =====================================================
   NFC - FORMULAIRE SANS EMAIL
===================================================== */

async function renderNfc(){
  const pages = nfcMode();

  const panel = el("section","panel");
  pages.appendChild(panel);

  const feedback = el("div");

  panel.appendChild(
    el("div","nfc-logo","EAH DIVING")
  );

  panel.appendChild(feedback);

  if(!state.sb){
    message(
      feedback,
      "Connexion Supabase indisponible.",
      true
    );
    return;
  }

  try{
    const card = await nfcLookup();

    if(!card){
      throw new Error(
        "Carte NFC introuvable. Vérifiez le lien."
      );
    }

    const profile = await nfcProfile();

    if(
      String(
        profile?.status ||
        card.card_status ||
        ""
      ).toUpperCase() === "ACTIVE"
    ){
      nfcRenderProfile(panel,profile,card);
      return;
    }

    panel.appendChild(
      el("h2","nfc-title","Créer mon profil EAH")
    );

    if(card.card_number){
      panel.appendChild(
        el("p","nfc-card-number",
          "Carte NFC n° " + card.card_number)
      );
    }

    description(
      panel,
      "Club : " + (card.club_name || "")
    );

    description(
      panel,
      "Complétez ce formulaire pour créer " +
      "votre profil EAH Diving. Votre carte NFC " +
      "sera activée immédiatement, sans e-mail."
    );

    const form = el("form","form");

    const first = field(
      form,"Prénom","text"
    );

    first.maxLength = 80;
    first.autocomplete = "given-name";

    const last = field(
      form,"Nom","text"
    );

    last.maxLength = 80;
    last.autocomplete = "family-name";

    const id = field(
      form,
      "Identifiant EAH personnalisé (facultatif)",
      "text",
      false
    );

    id.placeholder =
      card.default_identifier || "";

    id.pattern = "[A-Za-z0-9_-]{4,32}";
    id.maxLength = 32;

    description(
      form,
      "Vous pouvez choisir votre identifiant " +
      "personnalisé. Si vous laissez ce champ vide, " +
      "l'identifiant de la carte sera utilisé."
    );

    const driveLabel = el(
      "label",
      "",
      "Lien de photo (facultatif)"
    );

    const driveInput = el("input");
    driveInput.type = "url";
    driveInput.required = false;
    driveInput.placeholder =
      "https://drive.google.com/file/d/.../view";

    driveLabel.appendChild(driveInput);
    form.appendChild(driveLabel);

    const preview = el("img","nfc-preview");
    preview.hidden = true;
    form.appendChild(preview);

    driveInput.addEventListener("input",() => {
      const src = nfcPhotoUrl(driveInput.value);

      if(src){
        preview.src = src;
        preview.hidden = false;
      }else{
        preview.hidden = true;
      }
    });

    preview.onerror = () => {
      preview.hidden = true;
    };

    const submit = el(
      "button",
      "primary-button",
      "Créer mon profil et activer ma carte NFC"
    );

    submit.type = "submit";
    form.appendChild(submit);
    panel.appendChild(form);

    form.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        if(state.nfcBusy) return;

        state.nfcBusy = true;

        setBusy(
          submit,
          true,
          "Création du profil..."
        );

        try{
          const firstName = first.value.trim();
          const lastName = last.value.trim();
          const identifier = id.value.trim();

          if(
            firstName.length < 2 ||
            lastName.length < 2
          ){
            throw new Error(
              "Le prénom et le nom sont obligatoires."
            );
          }

          if(
            identifier &&
            !/^[A-Za-z0-9_-]{4,32}$/.test(identifier)
          ){
            throw new Error(
              "Identifiant EAH invalide : " +
              "4 à 32 caractères."
            );
          }

          const rawPhoto = driveInput.value.trim();

          const photoUrl = rawPhoto
            ? nfcPhotoUrl(rawPhoto)
            : null;

          if(rawPhoto && !photoUrl){
            throw new Error(
              "Le lien de photo est invalide."
            );
          }

          const result = await nfcCreateProfile({
            first:firstName,
            last:lastName,
            id:identifier,
            photoUrl:photoUrl
          });

          console.info(
            "Profil EAH créé :",
            result.eah_id
          );

          const updated = await nfcProfile();

          if(
            String(updated?.status || "")
              .toUpperCase() !== "ACTIVE"
          ){
            throw new Error(
              "Le profil a été enregistré, " +
              "mais son affichage n'a pas été confirmé."
            );
          }

          nfcRenderProfile(
            panel,
            updated,
            card
          );

        }catch(error){
          console.error(
            "Création NFC :",
            error
          );

          message(
            feedback,
            "Création impossible : " +
            errorText(error),
            true
          );

        }finally{
          state.nfcBusy = false;
          setBusy(submit,false);
        }
      }
    );

    panel.appendChild(
      el("hr","nfc-divider")
    );

    panel.appendChild(
      el("p","nfc-help",
        "Chaque carte NFC possède un lien unique. " +
        "Une fois le profil créé, cette carte est " +
        "définitivement attribuée. " +
        "Les scans suivants affichent le profil.")
    );

  }catch(error){
    console.error(
      "Erreur NFC :",
      error
    );

    message(
      feedback,
      "Erreur NFC : " + errorText(error),
      true
    );
  }
}

/* =====================================================
   ACTUALISATION PUBLIQUE
===================================================== */

let refreshBusy = false;

async function refreshPublic(){
  if(
    refreshBusy ||
    NFC_TOKEN ||
    !state.club ||
    state.cart.length ||
    document.activeElement?.matches(
      "input,textarea,select"
    )
  ){
    return;
  }

  refreshBusy = true;

  try{
    const page = state.currentPage;

    await loadClub();
    renderPages(page);

  }catch(error){
    console.warn(
      "Actualisation impossible :",
      errorText(error)
    );

  }finally{
    refreshBusy = false;
  }
}

/* =====================================================
   DEMARRAGE
===================================================== */

async function start(){
  try{
    if(!window.supabase?.createClient){
      throw new Error(
        "Bibliothèque Supabase indisponible."
      );
    }

    state.sb = window.supabase.createClient(
      SUPABASE_URL,
      PUBLIC_KEY,
      {
        auth:{
          persistSession:true,
          autoRefreshToken:true,
          detectSessionInUrl:true,
          flowType:"implicit"
        }
      }
    );

    /*
      MODE NFC :
      Prioritaire sur le site public.
      Aucune connexion email demandée.
    */

    if(NFC_TOKEN){
      await renderNfc();

      console.info(
        "EAH NFC : démarrage terminé.",
        CLUB_SLUG
      );

      return;
    }

    /*
      MODE SITE PUBLIC.
    */

    await loadClub();

    $("loading").hidden = true;
    $("app").hidden = false;

    renderPages();

    refreshMember()
      .then(() => {
        if(
          state.currentPage === "espace-club"
        ){
          renderPages("espace-club");
        }
      })
      .catch(error => {
        console.warn(
          "Authentification :",error
        );
      });

    setInterval(() => {
      if(!document.hidden){
        refreshPublic();
      }
    },60000);

    document.addEventListener(
      "visibilitychange",
      () => {
        if(!document.hidden){
          refreshPublic();
        }
      }
    );

    window.addEventListener(
      "hashchange",
      () => {
        const slug = decodeURIComponent(
          location.hash.slice(1)
        );

        if(slug){
          showPage(slug);
        }
      }
    );

    console.info(
      "EAH Diving Club : démarrage terminé."
    );

  }catch(error){
    console.error(
      "EAH démarrage :",error
    );

    $("loading").replaceChildren(
      el("div","status error",
        "Impossible de charger le club.\n" +
        errorText(error) +
        "\nVérifiez Supabase et les autorisations RLS.")
    );
  }
}

/* =====================================================
   LANCEMENT
===================================================== */

start();

})();
</script>
